<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rubik's Würfel mit Algorithmen</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: rgba(30, 30, 30, 0.85);
            --text-color: #fff;
            --accent-color: #00adb5;
            --accent-hover: #00fff5;
            --border-color: #444;
        }

        body.style-neon {
            --bg-color: #05050a;
            --panel-bg: rgba(10, 10, 25, 0.9);
            --text-color: #00ffcc;
            --accent-color: #ff007f;
            --accent-hover: #ff3399;
            --border-color: #00ffcc;
        }

        body.style-wood {
            --bg-color: #3d2817;
            --panel-bg: rgba(61, 40, 23, 0.9);
            --text-color: #f4e8c1;
            --accent-color: #c29b38;
            --accent-hover: #e6b849;
            --border-color: #8c5825;
        }

        body.style-minimal {
            --bg-color: #f0f0f0;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --text-color: #222;
            --accent-color: #333;
            --accent-hover: #555;
            --border-color: #ccc;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 320px;
            z-index: 10;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            opacity: 0.9;
        }

        input[type="text"], input[type="range"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            padding: 0;
            cursor: pointer;
        }

        button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            margin-right: 5px;
            margin-top: 5px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        #algo-list {
            max-height: 100px;
            overflow-y: auto;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .algo-item {
            background: rgba(255,255,255,0.05);
            padding: 6px;
            margin-bottom: 4px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .algo-item span {
            cursor: pointer;
            word-break: break-all;
            flex-grow: 1;
        }

        .algo-item button {
            padding: 2px 6px;
            font-size: 0.75rem;
            margin: 0;
            background: #d9534f;
        }

        .top-right-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .help-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
    </style>
    <!-- Three.js laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="top-right-controls">
        <button id="btn-fullscreen">Vollbild</button>
        <button onclick="setTheme('default')">Standard</button>
        <button onclick="setTheme('neon')">Neon</button>
        <button onclick="setTheme('wood')">Holz</button>
        <button onclick="setTheme('minimal')">Minimal</button>
    </div>

    <div class="ui-panel">
        <h2>Rubik's Würfel</h2>
        <div class="control-group">
            <button onclick="scrambleCube()">Mischen (Scramble)</button>
            <button onclick="resetCube()">Zurücksetzen</button>
        </div>

        <div class="control-group">
            <label for="speed-range">Geschwindigkeit:</label>
            <input type="range" id="speed-range" min="1" max="10" value="6" step="1">
        </div>
        
        <div class="control-group">
            <label for="algo-input">Algorithmus (z.B. R U R' U'):</label>
            <input type="text" id="algo-input" placeholder="R U R' U' F2">
            <div class="btn-row" style="margin-top: 8px;">
                <button onclick="runCurrentAlgo()">Ausführen</button>
                <button onclick="saveAlgo()">Speichern</button>
            </div>
        </div>

        <div class="control-group">
            <label>Gespeicherte Algorithmen:</label>
            <div id="algo-list"></div>
            <div class="btn-row" style="margin-top: 8px;">
                <button onclick="exportAlgosToFile()">Datei speichern</button>
                <button onclick="document.getElementById('file-input').click()">Datei laden</button>
                <input type="file" id="file-input" accept=".json" style="display: none;" onchange="importAlgosFromFile(event)">
            </div>
        </div>
    </div>

    <div class="help-text">
        Ansicht drehen: Klick & Ziehen | Züge: U, D, L, R, F, B (mit Shift/Strich für Gegenuhrzeigersinn)
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- Themen / Styles ---
        function setTheme(theme) {
            document.body.className = '';
            if (theme !== 'default') {
                document.body.classList.add('style-' + theme);
            }
        }

        // --- Vollbild ---
        const fullscreenBtn = document.getElementById('btn-fullscreen');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenBtn.innerText = 'Fenstermodus';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerText = 'Vollbild';
                }
            }
        });

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 7, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        const rubikGroup = new THREE.Group();
        scene.add(rubikGroup);

        // --- Rubik's Cube Logik ---
        const CUBE_SIZE = 0.95;
        const GAP = 0.05;
        const STEP_SIZE = CUBE_SIZE + GAP;
        let cubies = [];
        let isAnimating = false;

        const COLORS = [0xb90000, 0xff5900, 0xffffff, 0xffd500, 0x009b48, 0x0046ad];

        function createCube() {
            cubies.forEach(c => rubikGroup.remove(c));
            cubies = [];
            rubikGroup.rotation.set(0, 0, 0);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const materials = [];
                        for (let i = 0; i < 6; i++) {
                            let color = 0x111111; // Innenseite
                            if (i === 0 && x === 1) color = COLORS[0];
                            if (i === 1 && x === -1) color = COLORS[1];
                            if (i === 2 && y === 1) color = COLORS[2];
                            if (i === 3 && y === -1) color = COLORS[3];
                            if (i === 4 && z === 1) color = COLORS[4];
                            if (i === 5 && z === -1) color = COLORS[5];

                            materials.push(new THREE.MeshStandardMaterial({
                                color: color,
                                roughness: 0.3,
                                metalness: 0.1
                            }));
                        }

                        const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
                        const mesh = new THREE.Mesh(geometry, materials);
                        
                        mesh.userData = { x: x, y: y, z: z };
                        mesh.position.set(x * STEP_SIZE, y * STEP_SIZE, z * STEP_SIZE);
                        rubikGroup.add(mesh);
                        cubies.push(mesh);
                    }
                }
            }
        }

        createCube();

        // --- Exakte Matrix-basierte Drehung ---
        function rotateMove(face, clockwise, callback) {
            if (isAnimating) return;
            isAnimating = true;

            let axis, layerCoord;
            switch(face) {
                case 'R': axis = 'x'; layerCoord = 1; break;
                case 'L': axis = 'x'; layerCoord = -1; clockwise = !clockwise; break;
                case 'U': axis = 'y'; layerCoord = 1; break;
                case 'D': axis = 'y'; layerCoord = -1; clockwise = !clockwise; break;
                case 'F': axis = 'z'; layerCoord = 1; break;
                case 'B': axis = 'z'; layerCoord = -1; clockwise = !clockwise; break;
            }

            const affected = cubies.filter(c => Math.abs(c.userData[axis] - layerCoord) < 0.1);

            const animGroup = new THREE.Group();
            rubikGroup.add(animGroup);
            affected.forEach(c => animGroup.add(c));

            const targetAngle = (clockwise ? -1 : 1) * (Math.PI / 2);
            let currentAngle = 0;

            function animateStep() {
                const speedSetting = parseFloat(document.getElementById('speed-range').value) || 6;
                // Linear interpolation factor scales properly with speed setting
                const stepFactor = 0.08 * (speedSetting / 6);
                
                currentAngle += (targetAngle - currentAngle) * stepFactor;
                if (Math.abs(targetAngle - currentAngle) < 0.005) {
                    currentAngle = targetAngle;
                }

                if (axis === 'x') animGroup.rotation.x = currentAngle;
                if (axis === 'y') animGroup.rotation.y = currentAngle;
                if (axis === 'z') animGroup.rotation.z = currentAngle;

                if (currentAngle !== targetAngle) {
                    requestAnimationFrame(animateStep);
                } else {
                    const mMatrix = new THREE.Matrix4();
                    if (axis === 'x') mMatrix.makeRotationX(targetAngle);
                    if (axis === 'y') mMatrix.makeRotationY(targetAngle);
                    if (axis === 'z') mMatrix.makeRotationZ(targetAngle);

                    animGroup.rotation.set(0, 0, 0);

                    affected.forEach(c => {
                        rubikGroup.add(c);
                        c.applyMatrix4(mMatrix);

                        c.position.x = Math.round(c.position.x / STEP_SIZE) * STEP_SIZE;
                        c.position.y = Math.round(c.position.y / STEP_SIZE) * STEP_SIZE;
                        c.position.z = Math.round(c.position.z / STEP_SIZE) * STEP_SIZE;

                        c.userData.x = Math.round(c.position.x / STEP_SIZE);
                        c.userData.y = Math.round(c.position.y / STEP_SIZE);
                        c.userData.z = Math.round(c.position.z / STEP_SIZE);

                        const euler = new THREE.Euler().setFromQuaternion(c.quaternion, 'XYZ');
                        euler.x = Math.round(euler.x / (Math.PI / 2)) * (Math.PI / 2);
                        euler.y = Math.round(euler.y / (Math.PI / 2)) * (Math.PI / 2);
                        euler.z = Math.round(euler.z / (Math.PI / 2)) * (Math.PI / 2);
                        c.quaternion.setFromEuler(euler);
                    });

                    rubikGroup.remove(animGroup);
                    isAnimating = false;
                    if (callback) callback();
                }
            }

            animateStep();
        }

        // --- Befehls-Interpreter ---
        function executeMove(moveStr, callback) {
            const face = moveStr[0].toUpperCase();
            const prime = moveStr.includes("'");
            const double = moveStr.includes("2");

            if (!['R', 'L', 'U', 'D', 'F', 'B'].includes(face)) {
                if (callback) callback();
                return;
            }

            let clockwise = !prime;

            if (double) {
                rotateMove(face, clockwise, () => {
                    rotateMove(face, clockwise, callback);
                });
            } else {
                rotateMove(face, clockwise, callback);
            }
        }

        // --- Algorithmen Sequenz ausführen ---
        function runAlgorithmString(algoStr, onComplete) {
            const moves = algoStr.trim().split(/\s+/);
            let index = 0;

            function nextMove() {
                if (index < moves.length) {
                    executeMove(moves[index], () => {
                        index++;
                        setTimeout(nextMove, 15);
                    });
                } else {
                    if (onComplete) onComplete();
                }
            }
            nextMove();
        }

        function runCurrentAlgo() {
            const input = document.getElementById('algo-input').value;
            if (input) runAlgorithmString(input);
        }

        function scrambleCube() {
            const movesList = ['R', "R'", 'L', "L'", 'U', "U'", 'D', "D'", 'F', "F'", 'B', "B'"];
            let scrambleStr = '';
            for (let i = 0; i < 20; i++) {
                scrambleStr += movesList[Math.floor(Math.random() * movesList.length)] + ' ';
            }
            runAlgorithmString(scrambleStr);
        }

        function resetCube() {
            if (!isAnimating) createCube();
        }

        // --- Gespeicherte Algorithmen ---
        let savedAlgos = JSON.parse(localStorage.getItem('rubiks_algos') || '["R U R\' U\'", "F R U R\' U\' F\'", "R U2 R\' U\' R U\' R\'"]');

        function renderAlgoList() {
            const listContainer = document.getElementById('algo-list');
            listContainer.innerHTML = '';
            savedAlgos.forEach((algo, idx) => {
                const item = document.createElement('div');
                item.className = 'algo-item';
                
                const span = document.createElement('span');
                span.innerText = algo;
                span.onclick = () => runAlgorithmString(algo);

                const delBtn = document.createElement('button');
                delBtn.innerText = 'X';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    savedAlgos.splice(idx, 1);
                    localStorage.setItem('rubiks_algos', JSON.stringify(savedAlgos));
                    renderAlgoList();
                };

                item.appendChild(span);
                item.appendChild(delBtn);
                listContainer.appendChild(item);
            });
        }

        function saveAlgo() {
            const input = document.getElementById('algo-input').value.trim();
            if (input && !savedAlgos.includes(input)) {
                savedAlgos.push(input);
                localStorage.setItem('rubiks_algos', JSON.stringify(savedAlgos));
                renderAlgoList();
            }
        }

        // --- Datei Speicher & Lade Funktionen ---
        function exportAlgosToFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedAlgos, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "rubiks_algos.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importAlgosFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        // Zusammenführen ohne Duplikate
                        imported.forEach(algo => {
                            if (typeof algo === 'string' && !savedAlgos.includes(algo)) {
                                savedAlgos.push(algo);
                            }
                        });
                        localStorage.setItem('rubiks_algos', JSON.stringify(savedAlgos));
                        renderAlgoList();
                        alert("Algorithmen erfolgreich geladen!");
                    } else {
                        alert("Ungültiges Dateiformat (kein Array).");
                    }
                } catch (err) {
                    alert("Fehler beim Lesen der JSON-Datei.");
                }
                // Input zurücksetzen, damit dieselbe Datei nochmal ausgewählt werden kann
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        renderAlgoList();

        // --- Kamera- / Würfel-Steuerung per Maus / Touch ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            rubikGroup.rotation.y += deltaX * 0.008;
            rubikGroup.rotation.x += deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            rubikGroup.rotation.y += deltaX * 0.008;
            rubikGroup.rotation.x += deltaY * 0.008;

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Tastatur-Shortcuts (U, D, L, R, F, B)
        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            const key = e.key.toUpperCase();
            if (['U', 'D', 'L', 'R', 'F', 'B'].includes(key)) {
                const move = e.shiftKey ? key + "'" : key;
                executeMove(move);
            }
        });
    </script>
</body>
</html>
