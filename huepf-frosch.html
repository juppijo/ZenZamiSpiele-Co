<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hüpf-Frosch</title>
<style>
:root{
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --sky-top:#a9e2fb; --sky-low:#dcf5ff;
  --pond-top:#48c4d2; --pond-low:#1c86a3;
  --pad:#62c65a; --pad-dark:#2f8a3e; --pad-hi:#9be58a;
  --frog:#7ed957; --frog-dark:#4aa83a; --belly:#f6ffd9;
  --sun:#ffd23f;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
html,body{
  height:100%; margin:0; overflow:hidden; overscroll-behavior:none;
  background:#bfeaff;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
.scene{
  position:fixed; inset:0; overflow:hidden; touch-action:none;
  background:linear-gradient(var(--sky-top) 0%, var(--sky-low) 38%);
}
/* Himmel */
.sun{
  position:absolute; right:7vw; top:calc(env(safe-area-inset-top, 0px) + 3vh);
  width:clamp(64px, 16vmin, 120px); aspect-ratio:1;
  border-radius:50%;
  box-shadow:0 0 0 clamp(8px,2vmin,16px) rgba(255,210,63,.35), 0 0 60px 20px rgba(255,236,150,.6);
}
.sun svg{ width:100%; height:100%; display:block; }
.cloud{ position:absolute; left:0; width:clamp(90px,22vmin,170px); opacity:.95; animation:drift linear infinite; }
.cloud svg{ width:100%; display:block; }
.c1{ top:calc(env(safe-area-inset-top,0px) + 6vh); animation-duration:80s; animation-delay:-20s; }
.c2{ top:calc(env(safe-area-inset-top,0px) + 17vh); width:clamp(70px,16vmin,130px); animation-duration:110s; animation-delay:-70s; }
.c3{ top:calc(env(safe-area-inset-top,0px) + 26vh); width:clamp(60px,14vmin,110px); animation-duration:95s; animation-delay:-45s; }
@keyframes drift{ from{ transform:translateX(-30vw); } to{ transform:translateX(120vw); } }

/* Teich */
.pond{
  position:absolute; left:0; right:0; top:38%; bottom:0;
  background:linear-gradient(var(--pond-top), var(--pond-low));
}
.pond .wave{ position:absolute; left:0; top:-19px; width:100%; height:20px; display:block; }
.pond .glint{ position:absolute; height:2.2vmin; border-radius:50%; background:rgba(255,255,255,.16); }
.reeds{ position:absolute; top:calc(38% - 16vmin); height:17vmin; }
.reeds.l{ left:1vw; } .reeds.r{ right:1vw; transform:scaleX(-1); }

/* Spielfläche */
.play{
  position:absolute; pointer-events:none;
  inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
.pad{ position:absolute; left:0; top:0; cursor:pointer; will-change:transform; pointer-events:auto; }
.pad svg, .decor svg{ width:100%; height:100%; display:block; overflow:visible; }
.decor{ position:absolute; left:0; top:0; pointer-events:none; }
.fx{ position:absolute; inset:0; pointer-events:none; }
.ring{
  position:absolute; border:4px solid rgba(255,255,255,.9); border-radius:50%;
  box-sizing:border-box; pointer-events:none;
}
.spark{
  position:absolute; pointer-events:none;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}

/* Frosch */
#frog{
  position:absolute; left:0; top:0; cursor:pointer; touch-action:none; pointer-events:auto;
  will-change:transform; outline:none;
}
#frog:focus-visible .frog-in{ filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 8px #ff7a00); }
.frog-in{ width:100%; height:100%; transform-origin:50% 88%; position:relative; }
.frog-in svg{ width:100%; height:100%; display:block; overflow:visible; animation:breathe 3.2s ease-in-out infinite; transform-origin:50% 88%; }
@keyframes breathe{ 50%{ transform:scale(1.02,.975); } }
.hint{
  position:absolute; left:50%; top:52%; width:130%; aspect-ratio:1; margin:-65% 0 0 -65%;
  border-radius:50%; border:6px solid rgba(255,255,255,.85);
  animation:hint 1.6s ease-out infinite; pointer-events:none;
}
@keyframes hint{ from{ transform:scale(.6); opacity:.9; } to{ transform:scale(1.05); opacity:0; } }
body.played .hint{ display:none; }
#lids{ display:none; }
.blink #lids{ display:inline; }
.blink #eyes{ display:none; }

/* Wiese + Kaninchen */
.meadow{ position:absolute; left:0; right:0; top:calc(38% - 14vmin); height:14vmin; pointer-events:none; }
.meadow svg{ width:100%; height:100%; display:block; }
.grass-layer{ position:absolute; inset:0; pointer-events:none; }
.bunny{ position:absolute; left:0; top:0; pointer-events:none; clip-path:inset(-2000px -2000px 0 -2000px); }
.tuft{ position:absolute; cursor:pointer; pointer-events:auto; transform-origin:50% 100%; touch-action:none; outline-offset:2px; }
.tuft::before{ content:""; position:absolute; inset:-14px -8px -4px; }
.tuft svg{ width:100%; height:100%; display:block; overflow:visible; transform-origin:50% 100%; animation:sway 4s ease-in-out infinite; }
@keyframes sway{ 0%,100%{ transform:rotate(-1.6deg); } 50%{ transform:rotate(1.6deg); } }
.island{ position:absolute; pointer-events:none; }
.island svg{ width:100%; height:100%; display:block; overflow:visible; }
@media (prefers-reduced-motion: reduce){ .tuft svg{ animation:none; } }
.bunny-hide{ position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:50% 100%; }
.bunny-hop, .bunny-body{ width:100%; height:100%; }
.bunny-body{ transform-origin:50% 100%; }
.bunny-body svg{ width:100%; height:100%; display:block; overflow:visible; }
.ear-l{ transform-origin:34px 54px; animation:earL 3.6s ease-in-out infinite; }
.ear-r{ transform-origin:66px 54px; animation:earR 4.2s ease-in-out infinite; }
@keyframes earL{ 0%,100%{ transform:rotate(0deg); } 45%{ transform:rotate(-10deg); } 60%{ transform:rotate(-4deg); } }
@keyframes earR{ 0%,100%{ transform:rotate(0deg); } 30%{ transform:rotate(8deg); } 70%{ transform:rotate(3deg); } }
@media (prefers-reduced-motion: reduce){ .ear-l, .ear-r{ animation:none; } }

/* Seerose + Fisch */
.lily{ position:absolute; left:0; top:0; cursor:pointer; pointer-events:auto; outline-offset:4px; }
.lily-in{ width:100%; height:100%; transform-origin:50% 75%; }
.lily svg{ width:100%; height:100%; display:block; overflow:visible; animation:bob 3s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-4%); } }
.fish{ position:absolute; left:0; top:0; pointer-events:none; will-change:transform,opacity; opacity:0; }
.fish svg{ width:100%; height:100%; display:block; overflow:visible; }
.bubble{
  position:absolute; display:flex; align-items:center; justify-content:center;
  background:#fff; color:#1c7a94; border-radius:26px; opacity:0; transform-origin:50% 100%;
  font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif; font-weight:800;
  box-shadow:0 6px 0 rgba(28,122,148,.25); pointer-events:none;
}
.bubble::after{
  content:""; position:absolute; left:50%; bottom:-14px; margin-left:-12px;
  border:12px solid transparent; border-top-color:#fff; border-bottom:0;
}
@media (prefers-reduced-motion: reduce){ .lily svg{ animation:none; } }

/* Sonne, Wolken, Vogel */
.sun{ width:clamp(72px,18vmin,130px); cursor:pointer; outline-offset:6px; }
.cloud{ cursor:pointer; }
.cloud.c1{ width:clamp(110px,28vmin,200px); }
.cloud.c2{ width:clamp(90px,22vmin,160px); }
.cloud.c3{ width:clamp(80px,18vmin,130px); }
.cloud .cf{ fill:#fff; transition:fill .7s ease; }
.cloud.rainy .cf{ fill:#8e9bb0; }
.sky-fx{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.drop{ position:absolute; width:3px; height:16px; border-radius:3px; background:linear-gradient(rgba(124,195,255,0), #7cc3ff); }
.mnote{ position:absolute; font-size:clamp(22px,5vmin,36px); font-weight:700; line-height:1; pointer-events:none; }
.bird{ position:absolute; left:0; top:0; width:clamp(68px,16vmin,124px); aspect-ratio:1.2; cursor:pointer; touch-action:none; will-change:transform; z-index:5; }
.bird-flip{ width:100%; height:100%; transition:transform .28s ease-in-out; }
.bird-flip.left{ transform:scaleX(-1); }
.bird-spin{ width:100%; height:100%; }
.bird svg{ width:100%; height:100%; display:block; overflow:visible; }
.wing{ transform-origin:62px 56px; animation:flap .38s ease-in-out infinite; }
@keyframes flap{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(48deg); } }

@media (prefers-reduced-motion: reduce){
  .cloud, .frog-in svg, .hint{ animation:none; }
  .cloud{ transform:translateX(30vw); }
}
</style>
</head>

<script>
(() => {
  const play = document.getElementById('play');
  const frog = document.getElementById('frog');
  const inner = document.getElementById('frogIn');
  const svg = document.getElementById('frogSvg');
  const fxBelow = document.getElementById('fxBelow');
  const fxAbove = document.getElementById('fxAbove');
  const $ = id => document.getElementById(id);

  // Seerosenblätter (Anteile der Spielfläche)
  const LAYOUT = [[.22,.565],[.76,.545],[.50,.65],[.15,.75],[.85,.74],[.42,.845],[.84,.915]];
  // Tonleiter C-Dur: weiter oben im Bild = höherer Ton
  const PAD_NOTES  = [880.00, 987.77, 783.99, 659.25, 698.46, 587.33, 523.25];
  const PAD_COLORS = ['#7b8cff', '#c78bff', '#6fd3ff', '#ffe14d', '#c8ff8a', '#ffa53a', '#ff6b6b'];
  const DECOR  = [[.10,.45],[.90,.43],[.30,.485],[.72,.47]];

  const PAD_SVG = `<svg viewBox="0 0 200 100" aria-hidden="true">
    <ellipse cx="100" cy="56" rx="96" ry="40" fill="#2f8a3e"/>
    <ellipse cx="100" cy="48" rx="96" ry="40" fill="#62c65a"/>
    <path d="M100 48 L172 20 A96 40 0 0 1 196 46 Z" fill="#2aa0b8"/>
    <ellipse cx="100" cy="46" rx="82" ry="33" fill="none" stroke="%RING%" stroke-width="7" opacity=".95"/>
    <g stroke="#4fae4e" stroke-width="2.5" stroke-linecap="round" opacity=".7">
      <path d="M100 48 L30 44"/><path d="M100 48 L54 76"/><path d="M100 48 L110 84"/><path d="M100 48 L48 20"/><path d="M100 48 L120 12"/>
    </g></svg>`;
  const LOTUS_SVG = `<svg viewBox="0 0 200 130" aria-hidden="true">
    <ellipse cx="100" cy="108" rx="96" ry="20" fill="#2f8a3e"/>
    <ellipse cx="100" cy="102" rx="96" ry="20" fill="#62c65a"/>
    <g transform="translate(100 96)">
      <ellipse cx="-36" cy="-14" rx="16" ry="34" fill="#ff8fb5" transform="rotate(-58)"/>
      <ellipse cx="36" cy="-14" rx="16" ry="34" fill="#ff8fb5" transform="rotate(58)"/>
      <ellipse cx="-18" cy="-24" rx="16" ry="38" fill="#ffabc7" transform="rotate(-24)"/>
      <ellipse cx="18" cy="-24" rx="16" ry="38" fill="#ffabc7" transform="rotate(24)"/>
      <ellipse cx="0" cy="-28" rx="16" ry="40" fill="#ffd0e0"/>
      <circle cx="0" cy="-10" r="8" fill="#ffd23f"/>
    </g></svg>`;

  const pads = LAYOUT.map((_, i) => {
    const el = document.createElement('div');
    el.className = 'pad'; el.innerHTML = PAD_SVG.replace('%RING%', PAD_COLORS[i]);
    play.insertBefore(el, fxBelow);
    return { el, x:0, y:0 };
  });

  // ---------- Klang ----------
  let ac = null;
  function ctx(){
    try{
      if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
      if(ac && ac.state === 'suspended') ac.resume();
    }catch(e){}
    return ac;
  }
  function tone(o){
    const a = ctx(); if(!a) return;
    try{
      const t = a.currentTime + (o.delay || 0);
      const osc = a.createOscillator(), g = a.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f0, t);
      if(o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain || .2, t + .015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      osc.connect(g); g.connect(a.destination);
      osc.start(t); osc.stop(t + o.dur + .05);
    }catch(e){}
  }
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0];
  const sfx = {
    boing(){ tone({f0:180,f1:540,dur:.22,gain:.3}); tone({f0:540,f1:260,dur:.3,delay:.2,gain:.15}); },
    plop(){ tone({f0:520,f1:140,dur:.14,gain:.22}); },
    land(f){
      this.plop();
      const n = f || NOTES[Math.floor(Math.random()*NOTES.length)];
      tone({f0:n,dur:.8,type:'triangle',gain:.2,delay:.06});
      tone({f0:n*2,dur:.5,gain:.06,delay:.06});
    }
  };

  // ---------- Effekte ----------
  function ripple(x, y, w){
    for(let i = 0; i < 2; i++){
      const r = document.createElement('div');

        { duration:900, delay:i*180, easing:'ease-out', fill:'both' });
      a.finished.then(() => r.remove()).catch(() => r.remove());
    }
  }
  const SPARK_COLORS = ['#ffd23f','#ff8fb5','#ffffff','#9be58a','#7fd4ff'];
  function sparkles(x, y){
    for(let i = 0; i < 10; i++){
      const el = document.createElement('div');
      el.className = 'spark';

      el.style.width = el.style.height = size + 'px';

      el.style.background = SPARK_COLORS[i % SPARK_COLORS.length];

      const ang = (Math.PI*2*i/10) + Math.random()*.5;
      const dist = s*(.5 + Math.random()*.6);
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist*.8 - s*.2;
      const a = el.animate(
        [{ transform:'translate(0,0) scale(.3) rotate(0deg)', opacity:1 },
         { transform:`translate(${dx}px,${dy}px) scale(1) rotate(${Math.random()*200-100}deg)`, opacity:1, offset:.6 },
         { transform:`translate(${dx*1.1}px,${dy*1.1 + 20}px) scale(.2) rotate(180deg)`, opacity:0 }],
        { duration:700 + Math.random()*300, easing:'ease-out', fill:'both' });
      a.finished.then(() => el.remove()).catch(() => el.remove());
    }
  }

  // ---------- Frosch ----------
  function setPose(air){
    $('legsSit').style.display = air ? 'none' : '';
    $('legsJump').style.display = air ? '' : 'none';
    $('mouthClosed').style.display = air ? 'none' : '';
    $('mouthOpen').style.display = air ? '' : 'none';
  }

  async function hop(ti){
    if(busy || ti === cur) return;
    busy = true;
    document.body.classList.add('played');
    const a = frogPos(pads[cur]), b = frogPos(pads[ti]);
    const dir = b.x >= a.x ? 1 : -1;
    sfx.boing();
    try{
      await inner.animate(
        [{ transform:'scale(1,1)' }, { transform:'scale(1.16,.8)' }],
        { duration:140, easing:'ease-out', fill:'forwards' }).finished;
      setPose(true);
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const h = Math.max(s*.8, dist*.3);
      const dur = Math.min(900, 520 + dist*.35);
      const N = 30, kf = [];
      for(let i = 0; i <= N; i++){
        const t = i/N;
        kf.push({ transform:`translate3d(${a.x + (b.x-a.x)*t}px,${a.y + (b.y-a.y)*t - 4*h*t*(1-t)}px,0)` });
      }
      inner.animate([
        { transform:'scale(1.16,.8) rotate(0deg)' },
        { transform:`scale(.86,1.22) rotate(${-8*dir}deg)`, offset:.25 },
        { transform:`scale(.94,1.1) rotate(${6*dir}deg)`, offset:.75 },
        { transform:'scale(1,1) rotate(0deg)' }
      ], { duration:dur, easing:'ease-in-out', fill:'forwards' });
      const fly = frog.animate(kf, { duration:dur, easing:'linear', fill:'forwards' });
      await fly.finished;
      cur = ti;
      place();
      fly.cancel();
      setPose(false);
      const p = pads[ti];
      sfx.land(PAD_NOTES[ti]);
      ripple(p.x, p.y + ph*.05, pw*.9);
      sparkles(p.x, p.y - s*.35);
      inner.getAnimations().forEach(x => x.cancel());
      await inner.animate([
        { transform:'scale(1.18,.8)' },
        { transform:'scale(.95,1.06)', offset:.6 },
        { transform:'scale(1,1)' }
      ], { duration:280, easing:'ease-out' }).finished;
    }catch(e){
      cur = ti; place(); setPose(false);
    }
    inner.getAnimations().forEach(x => x.cancel());
    busy = false;
  }

  // Auf dem eigenen Blatt: nur hoch hüpfen und den Ton nochmal spielen
  async function hopInPlace(){
    if(busy) return;
    busy = true;
    document.body.classList.add('played');
    const p = frogPos(pads[cur]);
    tone({ f0:200, f1:520, dur:.14, gain:.16 });
    try{
      await inner.animate(
        [{ transform:'scale(1,1)' }, { transform:'scale(1.14,.84)' }],
        { duration:90, easing:'ease-out', fill:'forwards' }).finished;
      setPose(true);
      const h = s*.5, dur = 380, N = 24, kf = [];
      for(let i = 0; i <= N; i++){
        const t = i/N;
        kf.push({ transform:`translate3d(${p.x}px,${p.y - 4*h*t*(1 - t)}px,0)` });
      }
      inner.animate([
        { transform:'scale(1.14,.84)' },
        { transform:'scale(.9,1.16)', offset:.3 },
        { transform:'scale(.96,1.06)', offset:.75 },
        { transform:'scale(1,1)' }
      ], { duration:dur, easing:'ease-in-out', fill:'forwards' });
      const fly = frog.animate(kf, { duration:dur, easing:'linear', fill:'forwards' });
      await fly.finished;
      place();
      fly.cancel();
      setPose(false);
      const pad = pads[cur];
      sfx.land(PAD_NOTES[cur]);
      ripple(pad.x, pad.y + ph*.05, pw*.9);
      sparkles(pad.x, pad.y - s*.35);
      inner.getAnimations().forEach(x => x.cancel());
      busy = false;   // sofort wieder frei, damit man den Ton schnell wiederholen kann
      inner.animate([
        { transform:'scale(1.16,.82)' },
        { transform:'scale(.96,1.05)', offset:.6 },
        { transform:'scale(1,1)' }
      ], { duration:220, easing:'ease-out' });
    }catch(e){
      place(); setPose(false); busy = false;
    }
  }

  function randomOther(){
    const opts = pads.map((_, i) => i).filter(i => i !== cur);
    return opts[Math.floor(Math.random()*opts.length)];
  }

  frog.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); ctx();

  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Sonne, Wolken, Vogel ----------
  const scene = document.getElementById('scene');
  const skyFx = document.getElementById('skyFx');
  const sun = document.querySelector('.sun');
  const clouds = Array.from(document.querySelectorAll('.cloud'));
  const bird = $('bird'), birdFlip = $('birdFlip'), birdSpin = $('birdSpin');

  function makeButton(el, label, fn){
    el.setAttribute('role', 'button'); el.tabIndex = 0; el.setAttribute('aria-label', label);
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); });

  // Wasser antippen -> Wasserring
  scene.addEventListener('pointerdown', e => {
    e.preventDefault(); ctx();
    if(e.clientY < scene.clientHeight*.4) return;

  // --- Sonne: "Alle meine Entchen" ---
  const SONG = 'CDEFGGAAAAGAAAAGFFFFEEDDDDC'.split('');
  const BEATS = [1,1,1,1,2,2, 1,1,1,1,4, 1,1,1,1,4, 1,1,1,1,2,2, 1,1,1,1,4];
  const FREQ = { C:523.25, D:587.33, E:659.25, F:698.46, G:783.99, A:880.0 };
  const NOTE_COLORS = ['#ff8fb5','#ff9a2e','#7f6bff','#3fb86a'];
  let sunPlaying = false;

  function sunPulse(){
    sun.animate([
      { transform:'scale(1)' },
      { transform:'scale(1.14)', boxShadow:'0 0 0 16px rgba(255,200,40,.55), 0 0 90px 36px rgba(255,214,70,.9)', offset:.35 },
      { transform:'scale(1)' }
    ], { duration:420, easing:'ease-out' });
    const r = sun.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'mnote';
    el.textContent = Math.random() < .5 ? '\u266A' : '\u266B';
    el.style.color = NOTE_COLORS[Math.floor(Math.random()*NOTE_COLORS.length)];
    el.style.left = (r.left + r.width*(.1 + Math.random()*.6)) + 'px';
    el.style.top = (r.top + r.height*.6) + 'px';
    skyFx.appendChild(el);
    const dx = -(40 + Math.random()*90), dy = 60 + Math.random()*90;
    const a = el.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:0 },
      { opacity:1, offset:.15 },
      { transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*60-30}deg)`, opacity:0 }
    ], { duration:1800, easing:'ease-out' });
    a.finished.then(() => el.remove()).catch(() => el.remove());
  }
  function playSong(){
    if(sunPlaying) return;
    sunPlaying = true; ctx();
    const beat = .27; let t = 0;
    SONG.forEach((n, i) => {
      const d = BEATS[i]*beat, f = FREQ[n];
      tone({ f0:f, dur:Math.min(d*.95, .9), type:'triangle', gain:.2, delay:t + .05 });
      tone({ f0:f*2, dur:Math.min(d*.6, .5), gain:.05, delay:t + .05 });
      setTimeout(sunPulse, t*1000 + 50);
      t += d;
    });
    setTimeout(() => { sunPlaying = false; }, t*1000 + 400);
  }
  makeButton(sun, 'Sonne \u2013 antippen f\u00fcr ein Lied', playSong);

  // --- Wolke: Regen ---
  let noiseBuf = null;
  function rainSound(sec){
    const a = ctx(); if(!a) return;
    try{
      if(!noiseBuf){
        const len = a.sampleRate*2;
        noiseBuf = a.createBuffer(1, len, a.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      }
      const src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      const g = a.createGain(); const t = a.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(.07, t + .8);
      g.gain.setValueAtTime(.07, t + sec - 1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + sec);
      src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(a.destination);
      src.start(t); src.stop(t + sec + .1);
    }catch(e){}
  }
  function drop(x, y){
    const H = scene.clientHeight;
    const el = document.createElement('div');
    el.className = 'drop';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    skyFx.appendChild(el);
    const endY = Math.max(40, H*(.48 + Math.random()*.45) - y);
    const a = el.animate([
      { transform:'translateY(0)', opacity:.9 },
      { transform:`translateY(${endY}px)`, opacity:.9, offset:.9 },
      { transform:`translateY(${endY}px)`, opacity:0 }
    ], { duration:600 + Math.random()*300, easing:'ease-in' });
    a.finished.then(() => el.remove()).catch(() => el.remove());
  }
  function rain(cloud){
    if(cloud.classList.contains('rainy')) return;
    ctx();
    const dur = 4500, start = performance.now();
    cloud.classList.add('rainy');
    rainSound(dur/1000);
    const id = setInterval(() => {
      if(performance.now() - start > dur){ clearInterval(id); cloud.classList.remove('rainy'); return; }
      const r = cloud.getBoundingClientRect();
      drop(r.left + r.width*(.2 + Math.random()*.6), r.top + r.height*.85);
      if(Math.random() < .25) tone({ f0:900 + Math.random()*700, dur:.07, gain:.015 });
    }, 60);
  }
  clouds.forEach(c => makeButton(c, 'Wolke \u2013 antippen f\u00fcr Regen', () => rain(c)));

  // --- Seerose: Fisch springt raus und sagt "Hallo" ---
  function splashSound(vol){
    const a = ctx(); if(!a) return;
    try{
      if(!noiseBuf){
        const len = a.sampleRate*2;
        noiseBuf = a.createBuffer(1, len, a.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      }
      const src = a.createBufferSource(); src.buffer = noiseBuf;
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .7;
      const g = a.createGain(); const t = a.currentTime;
      bp.frequency.setValueAtTime(900, t);
      bp.frequency.exponentialRampToValueAtTime(2600, t + .28);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + .3);
      src.connect(bp); bp.connect(g); g.connect(a.destination);
      src.start(t); src.stop(t + .35);
    }catch(e){}
    tone({ f0:380, f1:900, dur:.12, gain:vol*.9, delay:.02 });
  }
  function sayHallo(){
    try{
      if('speechSynthesis' in window){
        const u = new SpeechSynthesisUtterance('Hallo!');
        u.lang = 'de-DE'; u.pitch = 1.6; u.rate = .85; u.volume = 1;
        const v = (speechSynthesis.getVoices() || []).find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
        if(v) u.voice = v;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        return;
      }
    }catch(e){}
    tone({ f0:660, f1:760, dur:.18, type:'triangle', gain:.2 });
    tone({ f0:880, f1:1040, dur:.3, type:'triangle', gain:.2, delay:.2 });
  }
  let fishBusy = false;
  function fishHello(){
    if(fishBusy) return;
    fishBusy = true; ctx();
    $('lilyIn').animate([
      { transform:'rotate(0deg) scale(1)' },
      { transform:'rotate(-8deg) scale(1.08)', offset:.3 },
      { transform:'rotate(7deg) scale(1.08)', offset:.65 },
      { transform:'rotate(0deg) scale(1)' }
    ], { duration:520, easing:'ease-in-out' });

    const dir = Math.random() < .5 ? 1 : -1;
    const sb = s/.85;
    const fw = Math.max(56, sb*.62), fh = fw*.73;
    const bw = Math.max(96, sb*.95), bh = bw*.5;
    const d = lw*.8, y0 = ly;
    const h = Math.max(sb*.55, Math.min(sb*1.15, y0 - bh - fh*.5 - 22));

    const fish = document.createElement('div');
    fish.className = 'fish'; fish.innerHTML = FISH_SVG;
    fish.style.width = fw + 'px'; fish.style.height = fh + 'px';
    fxAbove.appendChild(fish);

    const N = 36, kf = [];
    for(let i = 0; i <= N; i++){
      const t = i/N;
      const x = lx + dir*(2*t - 1)*d;
      const y = y0 - 4*h*t*(1 - t);
      const ang = Math.atan2(-4*h*(1 - 2*t), 2*d);
      const op = Math.min(1, t/.08, (1 - t)/.08);
      kf.push({ transform:`translate(${x - fw/2}px,${y - fh/2}px) scaleX(${dir}) rotate(${ang}rad)`, opacity:op });
    }
    const DUR = 1500;

    splashSound(.2);
    ripple(lx - dir*d, y0, lw*.7);
    sparkles(lx - dir*d, y0 - fh*.3);

    const fly = fish.animate(kf, { duration:DUR, easing:'linear', fill:'both' });

    // Sprechblase am höchsten Punkt
    const bub = document.createElement('div');
    bub.className = 'bubble'; bub.textContent = 'Hallo!';
    bub.style.width = bw + 'px'; bub.style.height = bh + 'px'; bub.style.fontSize = (bh*.5) + 'px';
    bub.style.left = (lx - bw/2) + 'px';
    bub.style.top = Math.max(4, y0 - h - fh*.5 - bh - 16) + 'px';
    fxAbove.appendChild(bub);
    setTimeout(() => {
      sayHallo();
      bub.animate([
        { transform:'scale(.3)', opacity:0 },
        { transform:'scale(1.12)', opacity:1, offset:.6 },
        { transform:'scale(1)', opacity:1 }
      ], { duration:280, easing:'ease-out', fill:'forwards' });
    }, DUR*.42);

    fly.finished.then(() => {
      fish.remove();
      splashSound(.12);
      ripple(lx + dir*d, y0, lw*.7);
      sparkles(lx + dir*d, y0 - fh*.3);
    }).catch(() => fish.remove());

    setTimeout(() => {
      bub.animate([{ opacity:1 }, { opacity:0 }], { duration:300, fill:'forwards' })
        .finished.then(() => bub.remove()).catch(() => bub.remove());
    }, DUR + 900);
    setTimeout(() => { fishBusy = false; }, DUR + 1200);
  }
  makeButton(lily, 'Seerose \u2013 antippen, dann kommt ein Fisch', fishHello);

  // Ton auch beim Loslassen freischalten (Touch-Geräte)
  ['pointerup','touchend','click','keydown'].forEach(ev =>
    document.addEventListener(ev, () => ctx(), { capture:true, passive:true }));

  // --- Grasbüschel: Das Kaninchen versteckt sich, man muss es suchen ---
  const grassLayer = $('grassLayer');
  const bunny = $('bunny'), bunnyHide = $('bunnyHide'), bunnyHop = $('bunnyHop'), bunnyBody = $('bunnyBody');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // t = Ufer-Wiese oder Insel, fx/fy = Anteil der Szene, k = Größe, hv = Höhe, d = Tiefe (Pixel nach hinten)
  const SPOTS = [
    { t:'bank',   fx:.62, k:.85, hv:1.10, d:12 },
    { t:'bank',   fx:.27, k:.80, hv:1.15, d:10 },
    { t:'bank',   fx:.92, k:.80, hv:1.20, d:9  },
    { t:'bank',   fx:.78, k:1.05,hv:1.00, d:4  },
    { t:'bank',   fx:.10, k:1.00,hv:1.00, d:2  },
    { t:'bank',   fx:.45, k:1.20,hv:.90,  d:0  },
    { t:'island', fx:.08, fy:.685, k:1.00, hv:1.00 },
    { t:'island', fx:.93, fy:.655, k:.90,  hv:1.10 }
  ];
  const GREENS = ['#2f8a3e','#3f9f46','#4aa83a','#54b84f','#62c65a','#7ad96c'];
  const FLOWERS = ['#ffffff','#ffd23f','#ff9db5','#c9a7ff'];
  function rng(seed){
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function tuftSVG(seed, flower){
    const r = rng(seed*7919 + 13);
    const n = 9 + Math.floor(r()*5);
    let blades = '', best = null;
    for(let i = 0; i < n; i++){
      const bx = 8 + 134*i/(n - 1) + (r() - .5)*8;
      const tip = 1 + r()*30, lean = (r() - .5)*38, w = 10 + r()*9;
      const c = GREENS[Math.floor(r()*GREENS.length)];
      const mid = tip + (60 - tip)*.5;
      blades += `<path d="M${(bx - w/2).toFixed(1)} 60 Q${(bx - w/2 + lean*.3).toFixed(1)} ${mid.toFixed(1)} ${(bx + lean).toFixed(1)} ${tip.toFixed(1)} Q${(bx + w/2 + lean*.5).toFixed(1)} ${(mid + 4).toFixed(1)} ${(bx + w/2).toFixed(1)} 60Z" fill="${c}"/>`;
      if(!best || tip < best.tip) best = { x:bx + lean, tip };
    }
    let fl = '';
    if(flower && best) fl = `<circle cx="${best.x.toFixed(1)}" cy="${(best.tip + 1).toFixed(1)}" r="5" fill="${FLOWERS[seed % FLOWERS.length]}"/><circle cx="${best.x.toFixed(1)}" cy="${(best.tip + 1).toFixed(1)}" r="2" fill="#ffb02e"/>`;
    return `<svg viewBox="0 0 150 60" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="53" width="150" height="7" rx="3" fill="#3a9a45"/>${blades}${fl}</svg>`;
  }
  const ISLAND_SVG = `<svg viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true">
    <ellipse cx="100" cy="46" rx="104" ry="13" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <ellipse cx="100" cy="42" rx="98" ry="16" fill="#2f8a3e"/>
    <ellipse cx="100" cy="36" rx="96" ry="16" fill="#79d36b"/>
    <ellipse cx="100" cy="33" rx="78" ry="9" fill="#93e384" opacity=".7"/>
  </svg>`;

  let bunnyRs = 78, bunnyIdx = 0, bunnyBusy = false;
  const spots = SPOTS.map(sp => ({ ...sp }));
  // Inseln zuerst, dann Büschel (weit hinten zuerst), damit sich alles richtig überdeckt
  spots.forEach(sp => {
    if(sp.t !== 'island') return;
    sp.isl = document.createElement('div');
    sp.isl.className = 'island'; sp.isl.innerHTML = ISLAND_SVG;
    grassLayer.appendChild(sp.isl);
  });
  spots.forEach((sp, i) => {
    const el = document.createElement('div');
    el.className = 'tuft';
    el.innerHTML = tuftSVG(i + 3, i % 3 === 0);
    const svgEl = el.firstChild;
    const rr = rng(i*31 + 5);
    svgEl.style.animationDuration = (3 + rr()*2.6) + 's';
    svgEl.style.animationDelay = (-rr()*4) + 's';
    grassLayer.appendChild(el);
    sp.el = el;
    makeButton(el, 'Grasbüschel \u2013 antippen und nachschauen', () => onTuft(i));
  });

  function layoutGrass(){
    const W = scene.clientWidth, H = scene.clientHeight;
    const rs = Math.max(58, Math.min(W*.2, H*.16, 140));
    bunnyRs = rs;
    spots.forEach(sp => {
      const tw = rs*1.15*sp.k, th = Math.max(rs*.36, tw*.5*sp.hv);
      sp.tw = tw; sp.th = th; sp.x = W*sp.fx;
      sp.base = sp.t === 'bank' ? H*.38 - 16 - sp.d : H*sp.fy;
      sp.el.style.width = tw + 'px'; sp.el.style.height = th + 'px';
      sp.el.style.left = (sp.x - tw/2) + 'px'; sp.el.style.top = (sp.base - th) + 'px';
      if(sp.isl){
        const iw = tw*1.7, ih = iw*.3;
        sp.isl.style.width = iw + 'px'; sp.isl.style.height = ih + 'px';
        sp.isl.style.left = (sp.x - iw/2) + 'px'; sp.isl.style.top = (sp.base - ih*.6) + 'px';
      }
    });
    positionBunny();
  }
  function positionBunny(){
    const sp = spots[bunnyIdx], rs = bunnyRs;
    bunny.style.width = rs + 'px'; bunny.style.height = (rs*1.2) + 'px';
    bunny.style.transform = `translate(${sp.x - rs/2}px,${sp.base - rs*1.2}px)`;
    if(bunny.nextSibling !== sp.el) grassLayer.insertBefore(bunny, sp.el);
    if(!bunnyBusy) bunnyHide.style.transform = `translateY(${rs*1.3}px)`;
  }

  function rustleSound(){
    const a = ctx(); if(!a) return;
    try{
      if(!noiseBuf){
        const len = a.sampleRate*2;
        noiseBuf = a.createBuffer(1, len, a.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      }
      const src = a.createBufferSource(); src.buffer = noiseBuf;
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = .8;
      const g = a.createGain(); const t = a.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(.07, t + .03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + .22);
      src.connect(bp); bp.connect(g); g.connect(a.destination);
      src.start(t); src.stop(t + .25);
    }catch(e){}
  }
  function wiggle(el, big){
    const k = big ? 1 : .7;
    el.animate([
      { transform:'rotate(0deg)' },
      { transform:`rotate(${-7*k}deg)`, offset:.25 },
      { transform:`rotate(${6*k}deg)`, offset:.55 },
      { transform:`rotate(${-3*k}deg)`, offset:.8 },
      { transform:'rotate(0deg)' }
    ], { duration:480, easing:'ease-in-out' });
  }

  function speak(text, pitch, rate){
    try{
      if('speechSynthesis' in window){
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE'; u.pitch = pitch; u.rate = rate; u.volume = 1;
        const v = (speechSynthesis.getVoices() || []).find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
        if(v) u.voice = v;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        return true;
      }
    }catch(e){}
    return false;
  }
  function sayKuckuck(){
    if(!speak('Kuckuck!', 1.5, .9)){
      tone({ f0:784, dur:.22, type:'sine', gain:.2 });
      tone({ f0:659, dur:.3, type:'sine', gain:.2, delay:.26 });
    }
  }
  async function callOut(sp, R){
    const rs = bunnyRs, W = scene.clientWidth;
    const bw = Math.max(110, rs*1.9), bh = bw*.4;
    const bub = document.createElement('div');
    bub.className = 'bubble'; bub.textContent = 'Kuckuck!';
    bub.style.width = bw + 'px'; bub.style.height = bh + 'px'; bub.style.fontSize = (bh*.45) + 'px';
    bub.style.left = Math.max(4, Math.min(W - bw - 4, sp.x - bw/2)) + 'px';
    bub.style.top = Math.max(4, sp.base - rs*1.2 - R - bh - 14) + 'px';
    skyFx.appendChild(bub);
    sayKuckuck();
    bub.animate([
      { transform:'scale(.3)', opacity:0 },
      { transform:'scale(1.12)', opacity:1, offset:.6 },
      { transform:'scale(1)', opacity:1 }
    ], { duration:280, easing:'ease-out', fill:'forwards' });
    await wait(1100);
    bub.animate([{ opacity:1 }, { opacity:0 }], { duration:250, fill:'forwards' })
      .finished.then(() => bub.remove()).catch(() => bub.remove());
  }
  async function bunnyLeap(x0, y0, x1, y1, h, dur){
    const kf = [], N = 22;
    for(let i = 0; i <= N; i++){
      const t = i/N;
      kf.push({ transform:`translate3d(${x0 + (x1-x0)*t}px,${y0 + (y1-y0)*t - 4*h*t*(1-t)}px,0)` });
    }
    tone({ f0:300, f1:620, dur:.12, gain:.14 });
    bunnyBody.animate([
      { transform:'scale(1.1,.88)' },
      { transform:'scale(.92,1.12)', offset:.25 },
      { transform:'scale(.96,1.05)', offset:.75 },
      { transform:'scale(1.1,.88)', offset:.95 },
      { transform:'scale(1,1)' }
    ], { duration:dur, easing:'ease-in-out' });
    const a = bunnyHop.animate(kf, { duration:dur, easing:'linear', fill:'forwards' });
    await a.finished;
    tone({ f0:240, f1:120, dur:.09, gain:.12 });
  }

  let lastTap = Date.now(), lastHint = 0;
  async function bunnyShow(){
    if(bunnyBusy) return;
    bunnyBusy = true; lastTap = Date.now(); ctx();
    const sp = spots[bunnyIdx], rs = bunnyRs;
    const R = Math.max(rs*.2, sp.th*.75), up = -R, hid = rs*1.3;
    const h = rs*.32, dur = 480, sx = rs*.28;
    try{
      const a = bunnyHide.animate([
        { transform:`translateY(${hid}px)` },
        { transform:`translateY(${up - rs*.1}px)`, offset:.6 },
        { transform:`translateY(${up}px)` }
      ], { duration:380, easing:'ease-out', fill:'forwards' });
      await a.finished;
      bunnyHide.style.transform = `translateY(${up}px)`; a.cancel();
      await callOut(sp, R);
      await bunnyLeap(0, 0, sx, 0, h, dur);
      await bunnyLeap(sx, 0, -sx, 0, h, dur);
      await bunnyLeap(-sx, 0, 0, 0, h, dur);
      bunnyHop.getAnimations().forEach(x => x.cancel());
      await callOut(sp, R);
      const b = bunnyHide.animate([
        { transform:`translateY(${up}px)` },
        { transform:`translateY(${hid}px)` }
      ], { duration:300, easing:'ease-in', fill:'forwards' });
      await b.finished;
    }catch(e){}
    bunnyHop.getAnimations().forEach(x => x.cancel());
    bunnyHide.getAnimations().forEach(x => x.cancel());
    bunnyHide.style.transform = `translateY(${hid}px)`;
    // neues Versteck (das Kaninchen ist jetzt komplett unsichtbar)
    const opts = spots.map((_, i) => i).filter(i => i !== bunnyIdx);
    bunnyIdx = opts[Math.floor(Math.random()*opts.length)];
    positionBunny();
    lastTap = Date.now();
    bunnyBusy = false;
  }
  function onTuft(i){
    ctx(); lastTap = Date.now();
    wiggle(spots[i].el, true);
    if(!bunnyBusy && i === bunnyIdx){ bunnyShow(); return; }
    rustleSound();
  }

  bunnyIdx = Math.floor(Math.random()*spots.length);
  layoutGrass();
  window.addEventListener('resize', layoutGrass);

  // Kleiner Tipp: Wenn lange niemand das Kaninchen findet, raschelt sein Büschel ab und zu
  setInterval(() => {
    const now = Date.now();
    if(bunnyBusy || now - lastTap < 40000 || now - lastHint < 12000) return;
    lastHint = now;
    wiggle(spots[bunnyIdx].el, false);
    if(ac) rustleSound();
  }, 1000);

  // --- Vogel: fliegt hin und her, Salto + Zwitschern ---
  const CHIRPS = [
    [[1400,2200],[1700,2500],[1500,2800],[2600,1800],[2000,2600]],
    [[2200,1500],[1500,2400],[2400,1600],[1600,2600],[2600,2000],[2000,2800]],
    [[1800,2400],[1800,2400],[2400,1700],[1700,2600]]
  ];
  function chirp(){
    const seq = CHIRPS[Math.floor(Math.random()*CHIRPS.length)];
    seq.forEach((c, i) => tone({ f0:c[0], f1:c[1], dur:.09, gain:.11, delay:i*.12 }));
  }
  let salto = false;
  function birdTap(){
    ctx();
    if(salto) return;
    salto = true;
    chirp();
    const a = birdSpin.animate([
      { transform:'translateY(0) rotate(0deg)' },
      { transform:'translateY(-30px) rotate(180deg)', offset:.5 },
      { transform:'translateY(0) rotate(360deg)' }
    ], { duration:800, easing:'ease-in-out' });
    a.finished.then(() => { salto = false; }).catch(() => { salto = false; });
    const r = bird.getBoundingClientRect(), pr = play.getBoundingClientRect();
    sparkles(r.left + r.width/2 - pr.left, r.top + r.height/2 - pr.top);
  }
  makeButton(bird, 'Vogel \u2013 antippen f\u00fcr einen Salto', birdTap);

  let bx = -1, bdir = 1, last = performance.now(), t0 = last;
  function birdFrame(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    const W = scene.clientWidth, H = scene.clientHeight, bw = bird.offsetWidth;
    const min = W*.03, max = W - bw - W*.03;
    if(bx < 0) bx = W*.1;
    bx += bdir*Math.max(90, W/7)*dt;
    if(bx > max){ bx = max; bdir = -1; birdFlip.classList.add('left'); }
    if(bx < min){ bx = min; bdir = 1; birdFlip.classList.remove('left'); }
    const t = (now - t0)/1000;
    const y = H*(.20 + .07*Math.sin(t*.45)) + Math.sin(t*3.2)*H*.008;
    bird.style.transform = `translate3d(${bx}px,${y}px,0)`;
    requestAnimationFrame(birdFrame);
  }
  requestAnimationFrame(birdFrame);

  // Blinzeln
  (function blinkLoop(){
    setTimeout(() => {
      if(!busy){
        svg.classList.add('blink');
        setTimeout(() => svg.classList.remove('blink'), 150);
      }
      blinkLoop();
    }, 2500 + Math.random()*2500);
  })();

  window.addEventListener('resize', layout);
  layout();
})();
</script>
