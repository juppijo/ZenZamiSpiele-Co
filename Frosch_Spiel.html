<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Interaktives Kinderspiel</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%);
    }

    /* Spielfeld / Teich */
    #pond {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #74ebe5 0%, #4ce3e7 40%, #2bb8d8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Sonne im Hintergrund */
    .sun {
      position: absolute;
      top: 30px;
      right: 60px;
      width: 105px;
      height: 105px;
      background-color: #ffde59;
      border-radius: 50%;
      box-shadow: 0 0 40px #ffde59;
      cursor: pointer;
      z-index: 5;
      touch-action: manipulation;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .sun.singing {
      animation: sunPulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes sunPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 40px #ffde59;
      }
      100% {
        transform: scale(1.15);
        box-shadow: 0 0 70px #ff9800;
      }
    }

    /* Dekorative Seerosen um den Fisch herum */
    .decor-lily {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.2));
      transition: transform 0.2s ease;
    }

    .decor-lily.interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    .decor-lily.interactive:active {
      transform: scale(0.9);
    }

    /* Floating animation for atmospheric feel */
    @keyframes gentleFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .floating {
      animation: gentleFloat 4s ease-in-out infinite alternate;
    }

    /* Reihe aus 7 Seerosenblättern */
    .lily-pads-container {
      position: absolute;
      bottom: 22%;
      left: 5vw;
      width: 90vw;
      height: 100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 6;
    }

    .pad-wrapper {
      position: relative;
      width: calc(90vw / 8.5);
      max-width: 110px;
      height: 80px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease;
    }

    .pad-wrapper:active {
      transform: scale(0.92);
    }

    .lily-pad-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.25));
    }

    .note-label {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    /* Der Frosch */
    .frog-container {
      position: absolute;
      bottom: 25%;
      left: 5vw;
      width: 100px;
      height: 90px;
      pointer-events: none;
      z-index: 8;
      transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .frog-container.jumping {
      animation: frogHopArc 0.4s ease-in-out;
    }

    @keyframes frogHopArc {
      0% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-90px) scale(1.1, 0.9); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* Grasbüschel-Zonen am Ufer */
    .grass-zone {
      position: absolute;
      bottom: -10px;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 12;
      transition: transform 0.15s ease;
    }

    .grass-zone.rustle {
      animation: rustleAnim 0.3s ease-in-out;
    }

    @keyframes rustleAnim {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg); }
      75% { transform: rotate(4deg); }
      100% { transform: rotate(0deg); }
    }

    /* Gras-Varianten */
    #grass-1 { left: 2%; width: 120px; height: 95px; }
    #grass-2 { left: 22%; width: 110px; height: 85px; }
    #grass-3 { left: 45%; width: 130px; height: 100px; }
    #grass-4 { left: 68%; width: 115px; height: 90px; }
    #grass-5 { left: 86%; width: 125px; height: 95px; }

    /* Das Kaninchen (wandert zwischen den Grasbüscheln) */
    .rabbit-container {
      position: absolute;
      bottom: -15px;
      left: 15px;
      width: 90px;
      height: 100px;
      pointer-events: none;
      z-index: 10;
      transform: translateY(75px);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .rabbit-container.peek {
      transform: translateY(-25px);
    }

    /* Grasbuschel SVG */
    .grass-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 11;
    }

    /* Sprechblase Kuckuck */
    .rabbit-bubble {
      position: absolute;
      top: -35px;
      left: 10px;
      background-color: #FFFFFF;
      border-radius: 15px;
      padding: 4px 10px;
      font-size: 15px;
      font-weight: bold;
      color: #ff5722;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease-out;
      pointer-events: none;
      z-index: 13;
    }

    .rabbit-bubble.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Der Vogel Container */
    .bird-container {
      position: absolute;
      top: 10%;
      left: -120px;
      width: 120px;
      height: 90px;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 10;
      animation: flyAcross 12s ease-in-out infinite alternate;
    }

    @keyframes flyAcross {
      0% {
        left: -120px;
        top: 10%;
        transform: scaleX(1);
      }
      49% {
        transform: scaleX(1);
      }
      50% {
        left: calc(100vw + 20px);
        top: 22%;
        transform: scaleX(-1);
      }
      99% {
        transform: scaleX(-1);
      }
      100% {
        left: -120px;
        top: 10%;
        transform: scaleX(1);
      }
    }

    .bird-svg-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bird-svg-wrapper.chirp {
      animation: birdLoop 0.7s ease-in-out;
    }

    @keyframes birdLoop {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(-360deg) scale(1.3); }
      100% { transform: rotate(-720deg) scale(1); }
    }

    /* Wolken Container */
    .cloud-container {
      position: absolute;
      top: 8%;
      left: 20%;
      width: 160px;
      height: 100px;
      cursor: pointer;
      z-index: 15;
      touch-action: manipulation;
      animation: floatCloud 7s ease-in-out infinite alternate;
    }

    @keyframes floatCloud {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(15px) translateX(25px); }
    }

    .cloud-svg path {
      transition: fill 0.3s ease;
    }

    .cloud-container.raining .cloud-svg path {
      fill: #78909C;
    }

    /* Regentröpfchen Container */
    .rain-container {
      position: absolute;
      top: 80px;
      left: 10px;
      width: 140px;
      height: 150px;
      pointer-events: none;
      display: none;
    }

    .cloud-container.raining .rain-container {
      display: block;
    }

    .drop {
      position: absolute;
      width: 4px;
      height: 18px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #29B6F6);
      border-radius: 2px;
      opacity: 0.8;
      animation: fall 0.5s linear infinite;
    }

    .drop:nth-child(1) { left: 20px; animation-delay: 0s; }
    .drop:nth-child(2) { left: 45px; animation-delay: 0.15s; }
    .drop:nth-child(3) { left: 70px; animation-delay: 0.05s; }
    .drop:nth-child(4) { left: 95px; animation-delay: 0.25s; }
    .drop:nth-child(5) { left: 120px; animation-delay: 0.1s; }

    @keyframes fall {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(120px); opacity: 0; }
    }

    /* Kleine Seerosenblüte */
    .flower-container {
      position: absolute;
      bottom: 15%;
      right: 8%;
      width: 85px;
      height: 85px;
      cursor: pointer;
      z-index: 9;
      touch-action: manipulation;
      transition: transform 0.2s ease;
    }

    .flower-container:active {
      transform: scale(0.9);
    }

    /* Der Fisch */
    .fish-container {
      position: absolute;
      bottom: 11%;
      right: 7%;
      width: 90px;
      height: 70px;
      pointer-events: none;
      z-index: 7;
      opacity: 0;
      transform: translateY(40px) scale(0.5);
      transition: transform 0.5s ease-out, opacity 0.3s ease-out;
    }

    .fish-container.pop-up {
      opacity: 1;
      transform: translateY(-50px) scale(1);
    }

    .bubble {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid #FFF;
      border-radius: 50%;
      top: -10px;
      left: 10px;
      opacity: 0;
      pointer-events: none;
    }

    .fish-container.pop-up .bubble {
      animation: bubbleRise 1.2s ease-out infinite;
    }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0; }
    }

    /* Sprechblase "Hallo!" */
    .speech-bubble {
      position: absolute;
      top: -40px;
      left: 50px;
      background-color: #FFFFFF;
      border-radius: 15px;
      padding: 5px 12px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s ease-out;
    }

    .fish-container.pop-up .speech-bubble {
      opacity: 1;
      transform: scale(1);
    }

    /* Vollbild-Button */
    #fullscreen-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 12px 20px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #ff7f50;
      border: 3px solid #fff;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 100;
    }

    #fullscreen-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="pond">
    <!-- Die Sonne -->
    <div class="sun" id="sun" onclick="playSunSong(event)"></div>

    <button id="fullscreen-btn" onclick="toggleFullscreen()">Vollbild ⛶</button>

    <!-- Die Wolke -->
    <div class="cloud-container" id="cloud" onclick="makeItRain(event)">
      <svg class="cloud-svg" viewBox="0 0 160 100" width="100%" height="100%">
        <path d="M 30 70 
                 A 25 25 0 0 1 35 25 
                 A 30 30 0 0 1 95 20

                 A 20 20 0 0 1 130 70 Z" 
              fill="#FFFFFF" 
              stroke="#E0E0E0" 
              stroke-width="3"/>
      </svg>

      <div class="rain-container">
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>

    </div>

    <!-- Der Vogel -->
    <div class="bird-container" id="bird" onclick="birdChirp(event)">
      <div class="bird-svg-wrapper" id="bird-wrapper">
        <svg viewBox="0 0 120 100" width="100%" height="100%">
          <path d="M 50 45 Q 30 10 10 30 Q 30 45 50 50" fill="#FF7043"/>

    <!-- ZUSÄTZLICHE SEEROSEN RUND UM DEN FISCH & IM TEICH -->

      <svg viewBox="0 0 100 70" width="100%" height="100%">
        <path d="M 10 35 A 40 25 0 1 0 90 35 A 40 25 0 1 0 10 35 Z" fill="#237045" stroke="#17482d" stroke-width="3"/>
        <polygon points="50,35 85,25 80,45" fill="#4ce3e7"/>

    </div>

    <div class="decor-lily floating" style="bottom: 18%; right: 3%; width: 60px; height: 45px; animation-delay: 1s;">
      <svg viewBox="0 0 100 70" width="100%" height="100%">
        <path d="M 10 35 A 40 25 0 1 0 90 35 A 40 25 0 1 0 10 35 Z" fill="#2e8b57" stroke="#1e5b38" stroke-width="3"/>
        <polygon points="50,35 20,15 15,35" fill="#4ce3e7"/>
      </svg>
    </div>

    <div class="decor-lily floating" style="bottom: 8%; right: 14%; width: 55px; height: 40px; animation-delay: 2s;">
      <svg viewBox="0 0 100 70" width="100%" height="100%">
        <path d="M 10 35 A 40 25 0 1 0 90 35 A 40 25 0 1 0 10 35 Z" fill="#3bb16f" stroke="#1e5b38" stroke-width="3"/>
        <polygon points="50,35 60,60 40,60" fill="#4ce3e7"/>
      </svg>
    </div>

    <!-- Interaktive gelbe Seerose neben dem Fisch -->
    <div class="decor-lily interactive floating" onclick="fishAppear(event)" style="bottom: 11%; right: 23%; width: 65px; height: 65px; animation-delay: 1.5s;">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <ellipse cx="50" cy="60" rx="35" ry="18" fill="#2e8b57"/>
        <path d="M 50 25 Q 38 45 50 62 Q 62 45 50 25" fill="#FFB74D"/>
        <path d="M 35 38 Q 30 55 50 62 Q 42 45 35 38" fill="#FFA726"/>
        <path d="M 65 38 Q 70 55 50 62 Q 58 45 65 38" fill="#FFA726"/>
        <circle cx="50" cy="55" r="7" fill="#FFF176"/>
      </svg>
    </div>

    <!-- 7 Seerosenblätter (Interaktiv mit Noten) -->
    <div class="lily-pads-container" id="pads-container"></div>

    <!-- Frosch SVG -->
    <div class="frog-container" id="frog">
      <svg viewBox="0 0 200 180" width="100%" height="100%">
        <ellipse cx="40" cy="130" rx="30" ry="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="4"/>
        <ellipse cx="160" cy="130" rx="30" ry="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="4"/>
        <ellipse cx="100" cy="110" rx="65" ry="50" fill="#66BB6A" stroke="#2E7D32" stroke-width="4"/>

        <circle cx="135" cy="50" r="25" fill="#66BB6A" stroke="#2E7D32" stroke-width="4"/>
        <circle cx="65" cy="50" r="16" fill="#FFFFFF"/>

    <!-- 5 Verschiedene Grasbüschel am Ufer -->

      <svg class="grass-front" viewBox="0 0 110 80">
        <path d="M 0 80 Q 20 10 35 0 Q 45 35 55 80 Q 70 15 85 5 Q 90 40 110 80 Z" fill="#388E3C"/>
        <path d="M 15 80 Q 35 25 50 10 Q 60 45 75 80 Q 85 30 100 20 Z" fill="#66BB6A"/>

    </div>

    <div class="grass-zone" id="grass-3" onclick="checkGrass(2, event)">

    <div class="grass-zone" id="grass-5" onclick="checkGrass(4, event)">

    <!-- Das EINZIGE Kaninchen -->

        <circle cx="20" cy="80" r="10" fill="#FFFFFF"/>
        <ellipse cx="40" cy="95" rx="18" ry="10" fill="#A1887F"/>

        <ellipse cx="50" cy="60" rx="40" ry="20" fill="#2e8b57"/>
        <path d="M 50 20 Q 35 45 50 65 Q 65 45 50 20" fill="#FF4081"/>
        <path d="M 30 35 Q 25 55 50 65 Q 40 45 30 35" fill="#F50057"/>
        <path d="M 70 35 Q 75 55 50 65 Q 60 45 70 35" fill="#F50057"/>
        <path d="M 20 50 Q 20 65 50 65 Q 35 55 20 50" fill="#FF80AB"/>

    <!-- Der Fisch -->
    <div class="fish-container" id="fish">
      <div class="bubble"></div>
      <div class="speech-bubble">Hallo!</div>
      <svg viewBox="0 0 100 80" width="100%" height="100%">
        <polygon points="20,40 0,20 0,60" fill="#FF5722"/>
        <ellipse cx="50" cy="40" rx="35" ry="25" fill="#FF9800"/>
        <ellipse cx="55" cy="45" rx="25" ry="18" fill="#FFC107"/>
        <circle cx="70" cy="32" r="6" fill="#FFFFFF"/>
        <circle cx="72" cy="32" r="3" fill="#000000"/>
        <circle cx="73" cy="30" r="1" fill="#FFFFFF"/>
        <path d="M 70 48 Q 75 52 80 46" fill="none" stroke="#D84315" stroke-width="3" stroke-linecap="round"/>
        <path d="M 40 15 Q 55 0 65 17" fill="#FF5722"/>
      </svg>
    </div>
  </div>

  <script>
    // Audio Context
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function ensureAudioContext() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 7 Noten für die Tonleiter C-Dur (C4 bis B4)
    const notesData = [
      { name: 'C', freq: 261.63 },
      { name: 'D', freq: 293.66 },
      { name: 'E', freq: 329.63 },
      { name: 'F', freq: 349.23 },
      { name: 'G', freq: 392.00 },
      { name: 'A', freq: 440.00 },
      { name: 'B', freq: 493.88 }
    ];

    // Erzeugen der 7 Seerosenblätter
    const padsContainer = document.getElementById('pads-container');
    const frog = document.getElementById('frog');

    notesData.forEach((note, index) => {
      const padWrapper = document.createElement('div');
      padWrapper.className = 'pad-wrapper';
      padWrapper.id = `pad-${index}`;

      padWrapper.innerHTML = `
        <svg class="lily-pad-svg" viewBox="0 0 100 70">
          <path d="M 10 35 A 40 25 0 1 0 90 35 A 40 25 0 1 0 10 35 Z" fill="#2e8b57" stroke="#1e5b38" stroke-width="4"/>
          <polygon points="50,35 90,20 90,50" fill="#4ce3e7"/>
        </svg>
        <div class="note-label">${note.name}</div>
      `;

      padWrapper.onclick = (e) => frogJumpToPad(index, note.freq, e);
      padsContainer.appendChild(padWrapper);
    });

    window.addEventListener('load', () => {
      updateFrogPosition(0);
      relocateRabbit();
    });

    function updateFrogPosition(index) {
      const pad = document.getElementById(`pad-${index}`);
      if (pad) {
        const padRect = pad.getBoundingClientRect();
        const pondRect = document.getElementById('pond').getBoundingClientRect();
        const targetLeft = padRect.left - pondRect.left + (padRect.width / 2) - 50;
        frog.style.left = `${targetLeft}px`;
      }
    }

    function frogJumpToPad(index, freq, event) {
      if (event) event.stopPropagation();
      ensureAudioContext();

      playFrogNoteSound(freq);
      updateFrogPosition(index);

      frog.classList.remove('jumping');
      void frog.offsetWidth;
      frog.classList.add('jumping');
    }

    function playFrogNoteSound(freq) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // --- LOGIK FÜR DAS VERSTECKTE KANINCHEN ---
    let currentRabbitIndex = 0;
    let isRabbitActive = false;

    function relocateRabbit(excludeIndex = -1) {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * 5);
      } while (newIndex === excludeIndex && 5 > 1);

      currentRabbitIndex = newIndex;
      const targetGrass = document.getElementById(`grass-${currentRabbitIndex + 1}`);
      const rabbit = document.getElementById('rabbit');
      
      targetGrass.appendChild(rabbit);
    }

    function checkGrass(index, event) {
      event.stopPropagation();
      ensureAudioContext();

      const grassElem = document.getElementById(`grass-${index + 1}`);

      if (index === currentRabbitIndex) {
        if (isRabbitActive) return;
        isRabbitActive = true;

        const rabbit = document.getElementById('rabbit');
        const bubble = document.getElementById('rabbit-bubble');

        rabbit.classList.add('peek');

        setTimeout(() => {
          bubble.classList.add('show');

          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance("Kuckuck!");
            utterance.lang = "de-DE";
            utterance.pitch = 1.7;
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
          }
        }, 150);

        setTimeout(() => {
          bubble.classList.remove('show');
          rabbit.classList.remove('peek');
          
          setTimeout(() => {
            relocateRabbit(index);
            isRabbitActive = false;
          }, 400);
        }, 1800);

      } else {
        grassElem.classList.remove('rustle');
        void grassElem.offsetWidth;
        grassElem.classList.add('rustle');
        playRustleSound();
      }
    }

    function playRustleSound() {
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
    }

    function playBirdMelody() {
      ensureAudioContext();
      const notes = [
        { freq: 1760, duration: 0.08, delay: 0 },
        { freq: 2217.46, duration: 0.1, delay: 0.09 },
        { freq: 2637.02, duration: 0.08, delay: 0.20 },
        { freq: 3520, duration: 0.15, delay: 0.30 },
        { freq: 2637.02, duration: 0.08, delay: 0.48 },
        { freq: 3520, duration: 0.2, delay: 0.58 }
      ];

      notes.forEach(note => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(note.freq, audioCtx.currentTime + note.delay);

        osc.frequency.exponentialRampToValueAtTime(
          note.freq * 1.1, 
          audioCtx.currentTime + note.delay + note.duration
        );

        gain.gain.setValueAtTime(0, audioCtx.currentTime + note.delay);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + note.delay + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.delay + note.duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + note.delay);
        osc.stop(audioCtx.currentTime + note.delay + note.duration);
      });
    }

    function playRainSound() {
      ensureAudioContext();
      const duration = 2.5;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1000;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
    }

    let isPlayingSong = false;
    function playSunSong(event) {
      event.stopPropagation();
      if (isPlayingSong) return;

      ensureAudioContext();
      isPlayingSong = true;

      const sun = document.getElementById('sun');
      sun.classList.add('singing');

      const notes = [
        { note: 261.63, dur: 0.35, delay: 0.0 },
        { note: 293.66, dur: 0.35, delay: 0.4 },
        { note: 329.63, dur: 0.35, delay: 0.8 },
        { note: 349.23, dur: 0.35, delay: 1.2 },
        { note: 392.00, dur: 0.70, delay: 1.6 },
        { note: 392.00, dur: 0.70, delay: 2.4 },
        
        { note: 440.00, dur: 0.35, delay: 3.2 },
        { note: 440.00, dur: 0.35, delay: 3.6 },
        { note: 440.00, dur: 0.35, delay: 4.0 },
        { note: 440.00, dur: 0.35, delay: 4.4 },
        { note: 392.00, dur: 0.80, delay: 4.8 }
      ];

      const totalDuration = 5.8;

      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.note, audioCtx.currentTime + n.delay);

        gain.gain.setValueAtTime(0, audioCtx.currentTime + n.delay);
        gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + n.delay + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + n.delay + n.dur);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + n.delay);
        osc.stop(audioCtx.currentTime + n.delay + n.dur);
      });

      setTimeout(() => {
        sun.classList.remove('singing');
        isPlayingSong = false;
      }, totalDuration * 1000);
    }

    function playSplashSound() {
      ensureAudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    let isFishActive = false;
    function fishAppear(event) {
      event.stopPropagation();
      if (isFishActive) return;

      isFishActive = true;
      const fish = document.getElementById('fish');
      
      playSplashSound();
      fish.classList.add('pop-up');

      setTimeout(() => {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance("Hallo!");
          utterance.lang = "de-DE";
          utterance.pitch = 1.6;
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      }, 200);

      setTimeout(() => {
        fish.classList.remove('pop-up');
        isFishActive = false;
      }, 2500);
    }

    function birdChirp(event) {
      event.stopPropagation();
      const birdWrapper = document.getElementById('bird-wrapper');
      
      playBirdMelody();

      birdWrapper.classList.remove('chirp');
      void birdWrapper.offsetWidth;
      birdWrapper.classList.add('chirp');
    }

    let isRaining = false;
    function makeItRain(event) {
      event.stopPropagation();
      if (isRaining) return;

      isRaining = true;
      const cloud = document.getElementById('cloud');
      
      playRainSound();
      cloud.classList.add('raining');

      setTimeout(() => {
        cloud.classList.remove('raining');
        isRaining = false;
      }, 2500);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(`Fehler beim Aktivieren des Vollbildmodus: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('resize', () => {
      const currentPadIndex = Math.min(Math.max(0, Math.floor((parseFloat(frog.style.left) || 0) / (window.innerWidth / 7))), 6);
      updateFrogPosition(currentPadIndex);
    });
  </script>
</body>
</html>
