<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot Editor & Exporter</title>
  <style>
    :root {
      --bg-color: #12181f;
      --panel-bg: #1e2631;
      --accent-color: #00ced1;
      --text-color: #e0e6ed;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    #viewport {
      flex: 1;
      position: relative;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0d12;
    }
    #img-container {
      position: relative;
      display: inline-block;
    }
    #img-container img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border-radius: 50%;
      box-sizing: border-box;
      transition: transform 0.2s;
    }
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.2);
    }
    .hotspot-pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 206, 209, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(0, 206, 209, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 206, 209, 0); }
    }
    label { font-size: 0.85rem; opacity: 0.9; }
    input, button {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 5px;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Hotspot Editor</h3>
    
    <label>Bild-URL (Externe Verlinkung):</label>
    <input type="text" id="img-url" value="https://picsum.photos/1000/600" onchange="updateImage()">

    <h4>Marker-Styling</h4>
    <label>Farbe:</label>
    <input type="color" id="style-color" value="#00ced1" onchange="renderHotspots()">
    
    <label>Größe (px):</label>
    <input type="number" id="style-size" value="20" min="5" max="50" onchange="renderHotspots()">
    
    <label>Transparenz (0 - 1):</label>
    <input type="number" id="style-opacity" value="0.8" step="0.1" min="0.1" max="1" onchange="renderHotspots()">

    <label>
      <input type="checkbox" id="style-pulse" checked onchange="renderHotspots()" style="width:auto"> Pulsierender Effekt
    </label>

    <hr style="border-color: #334155; width: 100%;">

    <button onclick="exportHTML()">HTML-Seite Exportieren</button>
  </div>

  <div id="viewport">
    <div id="img-container" onclick="addHotspot(event)">
      <img id="main-img" src="https://picsum.photos/1000/600" alt="Hotspot Bild">
    </div>
  </div>

  <script>
    let hotspots = [];

    function updateImage() {
      document.getElementById('main-img').src = document.getElementById('img-url').value;
    }

    function addHotspot(e) {
      if (e.target.tagName !== 'IMG') return;
      
      const rect = e.target.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      
      const link = prompt("Ziel-URL für diesen Marker eingeben:", "https://example.com");
      const label = prompt("Label/Beschreibung (optional):", "Marker");

      if (link) {
        hotspots.push({ x, y, link, label: label || "" });
        renderHotspots();
      }
    }

    function renderHotspots() {
      const container = document.getElementById('img-container');
      // Alte Hotspots entfernen
      document.querySelectorAll('.hotspot').forEach(el => el.remove());

      const color = document.getElementById('style-color').value;
      const size = document.getElementById('style-size').value + 'px';
      const opacity = document.getElementById('style-opacity').value;
      const pulse = document.getElementById('style-pulse').checked;

      hotspots.forEach(hs => {
        const el = document.createElement('a');
        el.className = `hotspot ${pulse ? 'hotspot-pulse' : ''}`;
        el.href = hs.link;
        el.target = "_blank";
        el.title = hs.label;
        
        el.style.left = hs.x + '%';
        el.style.top = hs.y + '%';
        el.style.width = size;
        el.style.height = size;
        el.style.backgroundColor = color;
        el.style.opacity = opacity;

        container.appendChild(el);
      });
    }

    function exportHTML() {
      const imgUrl = document.getElementById('img-url').value;
      const color = document.getElementById('style-color').value;
      const size = document.getElementById('style-size').value + 'px';
      const opacity = document.getElementById('style-opacity').value;
      const pulse = document.getElementById('style-pulse').checked;

      // Generiere eine eigenständige HTML-Datei mit Vollbild-Modus
      const htmlContent = `<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vollbild Hotspot Ansicht</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #wrapper {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }
    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background-color: ${color};
      width: ${size};
      height: ${size};
      opacity: ${opacity};
      transition: transform 0.2s;
    }
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.3);
    }
    ${pulse ? `
    .hotspot { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 ${color}b3; }
      70% { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
    }` : ''}
    #fs-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
      font-family: sans-serif;
    }
    #fs-btn:hover { background: rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <button id="fs-btn" onclick="toggleFullscreen()">⛶ Vollbild</button>

  <div id="wrapper">
    <img src="${imgUrl}" alt="Hotspot Bild">
    ${hotspots.map(hs => `
      <a class="hotspot" 
         href="${hs.link}" 
         target="_blank" 
         title="${hs.label}" 
         style="left: ${hs.x}%; top: ${hs.y}%;">
      </a>`).join('')}
  </div>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  <\/script>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hotspot-ansicht.html';
      a.click();
    }
  </script>
</body>
</html>
