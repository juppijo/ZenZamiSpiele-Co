<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebRTC P2P Chat, Share & Whiteboard</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome für Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Marked.js für Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify für XSS Schutz bei Markdown -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <style>
    :root {
        --bg-main: #f3f4f6;
        --bg-card: #ffffff;
        --bg-chat: #f9fafb;
        --text-main: #1f2937;
        --border-color: #e5e7eb;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --msg-sent: #3b82f6;
        --msg-sent-text: #ffffff;
        --msg-recv: #ffffff;
        --msg-recv-text: #1f2937;
    }
    
    [data-theme="dark"] {
        --bg-main: #111827;
        --bg-card: #1f2937;
        --bg-chat: #111827;
        --text-main: #f9fafb;
        --border-color: #374151;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --msg-sent: #2563eb;
        --msg-sent-text: #ffffff;
        --msg-recv: #374151;
        --msg-recv-text: #f9fafb;
    }
    
    [data-theme="emerald"] {
        --bg-main: #ecfdf5;
        --bg-card: #ffffff;
        --bg-chat: #f0fdf4;
        --text-main: #064e3b;
        --border-color: #a7f3d0;
        --primary: #059669;
        --primary-hover: #047857;
        --msg-sent: #059669;
        --msg-sent-text: #ffffff;
        --msg-recv: #ffffff;
        --msg-recv-text: #064e3b;
    }
    
    [data-theme="cyberpunk"] {
        --bg-main: #0f051d;
        --bg-card: #200b3b;
        --bg-chat: #150727;
        --text-main: #00f5d4;
        --border-color: #7b2cbf;
        --primary: #f72585;
        --primary-hover: #b5179e;
        --msg-sent: #7209b7;
        --msg-sent-text: #ffffff;
        --msg-recv: #200b3b;
        --msg-recv-text: #00f5d4;
    }
    
    html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        touch-action: manipulation;
    }
    
    body {
        background-color: var(--bg-main);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .app-card { background-color: var(--bg-card); border-color: var(--border-color); }
    .chat-area { background-color: var(--bg-chat); }
    .btn-primary { background-color: var(--primary); color: #ffffff; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    
    .msg-sent { background-color: var(--msg-sent); color: var(--msg-sent-text); }
    .msg-recv { background-color: var(--msg-recv); color: var(--msg-recv-text); border: 1px solid var(--border-color); }
    
    .markdown-body p { margin-bottom: 0.25rem; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body code { background: rgba(0,0,0,0.15); padding: 0.1rem 0.3rem; border-radius: 0.2rem; font-family: monospace; }
    .markdown-body pre { background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 0.4rem; overflow-x: auto; margin: 0.3rem 0; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.2rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.2rem; }
    .markdown-body a { text-decoration: underline; word-break: break-all; }
    
    #dropOverlay.active, #lightboxModal.active, #whiteboardModal.active { display: flex !important; }
    
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col h-full font-sans antialiased select-none">

  <!-- Drag and Drop Overlay -->
  <div id="dropOverlay" class="fixed inset-0 bg-blue-600/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center text-white border-4 border-dashed border-white m-4 rounded-3xl pointer-events-none transition-all">
    <i class="fa-solid fa-cloud-arrow-up text-6xl mb-4 animate-bounce"></i>
    <p class="text-xl font-bold">Datei hier fallen lassen zum Senden</p>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-3xl p-2 hover:text-gray-300">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="lightboxImg" class="max-w-full max-h-full object-contain rounded-lg" src="" alt="Vorschau">
  </div>

  <!-- Whiteboard Modal -->
  <div id="whiteboardModal" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-2 sm:p-4 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 w-full max-w-4xl h-[90vh] rounded-2xl flex flex-col overflow-hidden shadow-2xl border border-gray-700">
      <header class="p-3 bg-gray-100 dark:bg-gray-900 border-b flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-pen-ruler text-blue-500 text-lg"></i>
          <h2 class="font-bold text-sm sm:text-base">Gemeinsames Whiteboard</h2>
        </div>
        <div class="flex items-center space-x-2">
          <input type="color" id="wbColor" value="#3b82f6" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
          <select id="wbBrushSize" class="text-xs p-1 rounded bg-gray-200 dark:bg-gray-700">
            <option value="2">Dünn</option>
            <option value="5" selected>Mittel</option>
            <option value="12">Dick</option>
          </select>
          <button onclick="setEraser()" id="wbEraserBtn" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded text-xs font-semibold hover:bg-gray-300">
            <i class="fa-solid fa-eraser"></i>
          </button>
          <button onclick="clearWhiteboard(true)" class="px-2 py-1 bg-red-500 text-white rounded text-xs font-semibold hover:bg-red-600">
            <i class="fa-solid fa-trash"></i>
          </button>
          <button onclick="toggleWhiteboard()" class="px-2 py-1 bg-gray-500 text-white rounded text-xs font-semibold">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </header>
      <div class="flex-1 relative bg-white touch-none" id="canvasContainer">
        <canvas id="wbCanvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>
      </div>
    </div>
  </div>

  <!-- Haupt-Container -->
  <div id="appContainer" class="flex flex-col h-full w-full max-w-5xl mx-auto p-0 sm:p-4 transition-all">

    <div class="app-card flex flex-col h-full w-full sm:rounded-2xl border shadow-xl overflow-hidden relative">

      <!-- Header Bar -->
      <header class="flex items-center justify-between p-3 sm:p-4 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full btn-primary flex items-center justify-center font-bold text-lg shadow">
            <i class="fa-solid fa-comments"></i>
          </div>
          <div>
            <h1 class="font-bold text-base sm:text-lg leading-tight">WebRTC P2P Chat</h1>
            <div class="flex items-center space-x-2 text-xs">
              <span id="statusBadge" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-300">
                <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-yellow-500 animate-pulse"></span> Getrennt
              </span>
            </div>
          </div>
        </div>

        <!-- Controls Top Right -->
        <div class="flex items-center space-x-1 sm:space-x-2">
          <button onclick="toggleWhiteboard()" class="p-2 sm:px-3 sm:py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-xs sm:text-sm font-medium transition text-purple-600 dark:text-purple-400" title="Whiteboard öffnen">
            <i class="fa-solid fa-chalkboard"></i>
          </button>

          <button onclick="toggleScreenShare()" id="screenShareBtn" class="p-2 sm:px-3 sm:py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-xs sm:text-sm font-medium transition text-blue-600 dark:text-blue-400" title="Bildschirm teilen">
            <i class="fa-solid fa-desktop"></i>
          </button>

          <select id="themeSelect" onchange="changeTheme(this.value)" class="text-xs sm:text-sm bg-gray-100 dark:bg-gray-700 border-none rounded-lg p-2 font-medium cursor-pointer outline-none">
            <option value="light">☀️ Hell</option>
            <option value="dark">🌙 Dunkel</option>
            <option value="emerald">🌿 Smaragd</option>
            <option value="cyberpunk">⚡ Cyberpunk</option>
          </select>

          <button onclick="toggleSettings()" class="p-2 sm:px-3 sm:py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-xs sm:text-sm font-medium transition flex items-center space-x-1">
            <i class="fa-solid fa-gear"></i>
            <span class="hidden sm:inline">Verbindung</span>
          </button>

          <button onclick="toggleFullscreen()" class="p-2 sm:px-3 sm:py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-xs sm:text-sm font-medium transition">
            <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
          </button>
        </div>
      </header>

      <!-- Video Stream Container (Screen Sharing) -->
      <div id="videoContainer" class="hidden relative w-full bg-black aspect-video max-h-72 border-b border-gray-700">
        <video id="remoteVideo" autoplay playsinline class="w-full h-full object-contain"></video>
        <video id="localVideo" autoplay playsinline muted class="absolute bottom-2 right-2 w-1/4 max-w-[120px] aspect-video border-2 border-white rounded shadow-lg object-cover"></video>
        <button onclick="closeScreenShare()" class="absolute top-2 right-2 bg-red-600 text-white px-2 py-1 rounded text-xs font-bold shadow">
          <i class="fa-solid fa-xmark mr-1"></i> Beenden
        </button>
      </div>

      <!-- Signalisierungs-Bereich -->
      <section id="settingsPanel" class="border-b border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50 p-4 overflow-y-auto max-h-[60vh] transition-all">

        <!-- Live Diagnostics Banner -->
        <div id="connectionDiag" class="mb-4 p-3 rounded-xl bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2">
            <i id="diagSpinner" class="fa-solid fa-circle-notch animate-spin text-blue-500 hidden"></i>
            <i id="diagIcon" class="fa-solid fa-network-wired text-blue-500"></i>
            <div>
              <span class="font-bold">Verbindungs-Status: </span>
              <span id="diagStatusText" class="font-mono text-gray-700 dark:text-gray-300">Getrennt (Bereit)</span>
            </div>
          </div>
          <span id="iceStateBadge" class="px-2 py-0.5 rounded bg-gray-200 dark:bg-gray-700 font-mono text-[10px]">ICE: new</span>
        </div>

        <div id="errorAlert" class="hidden mb-4 p-3 rounded-xl bg-red-100 dark:bg-red-900/40 border border-red-300 text-red-700 dark:text-red-300 text-xs">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="errorMessage"></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs sm:text-sm">
          <!-- Schritt 1: Offer & Link teilen -->
          <div class="space-y-2 p-3 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col justify-between">
            <div class="space-y-2">
              <span class="font-bold text-blue-500 block">1. Angebot (Peer A)</span>
              <button onclick="startCall()" class="w-full btn-primary py-2 px-3 rounded-lg font-semibold shadow text-xs">
                <i class="fa-solid fa-play mr-1"></i> Angebot erstellen
              </button>
              <div class="relative">
                <textarea id="localOffer" readonly class="w-full h-16 p-2 text-xs font-mono bg-gray-50 dark:bg-gray-900 border rounded-lg resize-none outline-none" placeholder="Angebot erscheint hier..."></textarea>
                <button onclick="copyToClipboard('localOffer', this)" class="absolute top-2 right-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 px-2 py-1 rounded text-xs" title="JSON kopieren">
                  <i class="fa-regular fa-copy"></i>
                </button>
              </div>
            </div>
            <!-- NEU: Link per Messenger teilen -->
            <button onclick="copyShareLink(this)" id="btnShareLink" disabled class="w-full mt-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white py-2 px-3 rounded-lg font-semibold shadow text-xs flex items-center justify-center transition">
              <i class="fa-solid fa-share-nodes mr-1.5"></i> Link kopieren (für Messenger)
            </button>
          </div>

          <!-- Schritt 2: Answer -->
          <div class="space-y-2 p-3 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col justify-between">
            <div class="space-y-2">
              <span class="font-bold text-purple-500 block">2. Antwort (Peer B)</span>
              <textarea id="remoteOffer" class="w-full h-16 p-2 text-xs font-mono bg-gray-50 dark:bg-gray-900 border rounded-lg resize-none outline-none" placeholder="Angebot einfügen oder Link öffnen..."></textarea>
              <button onclick="acceptCall()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 px-3 rounded-lg font-semibold shadow text-xs">
                <i class="fa-solid fa-reply mr-1"></i> Antwort generieren
              </button>
            </div>
            <div class="relative mt-2">
              <textarea id="localAnswer" readonly class="w-full h-16 p-2 text-xs font-mono bg-gray-50 dark:bg-gray-900 border rounded-lg resize-none outline-none" placeholder="Antwort erscheint hier..."></textarea>
              <button onclick="copyToClipboard('localAnswer', this)" class="absolute top-2 right-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 px-2 py-1 rounded text-xs">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>

          <!-- Schritt 3: Confirm -->
          <div class="space-y-2 p-3 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col justify-between">
            <div>
              <span class="font-bold text-green-500 block">3. Bestätigen (Peer A)</span>
              <textarea id="remoteAnswer" class="w-full h-24 p-2 text-xs font-mono bg-gray-50 dark:bg-gray-900 border rounded-lg resize-none outline-none mb-2" placeholder="Antwort von Peer B einfügen..."></textarea>
            </div>
            <button id="btnConfirmAnswer" onclick="confirmAnswer()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-3 rounded-lg font-semibold shadow text-xs flex items-center justify-center">
              <i class="fa-solid fa-check mr-1"></i> Verbindung starten
            </button>
          </div>
        </div>
      </section>

      <!-- Chat Verlauf -->
      <main id="chatlog" class="chat-area flex-1 p-4 overflow-y-auto space-y-4 text-sm"></main>

      <!-- Emoji Picker Popover -->
      <div id="emojiPicker" class="hidden absolute bottom-20 left-4 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-2xl p-3 grid grid-cols-6 gap-2 text-xl z-40 max-h-48 overflow-y-auto">
        <button onclick="insertEmoji('😊')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">😊</button>
        <button onclick="insertEmoji('😂')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">😂</button>
        <button onclick="insertEmoji('❤️')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">❤️</button>
        <button onclick="insertEmoji('👍')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">👍</button>
        <button onclick="insertEmoji('🔥')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">🔥</button>
        <button onclick="insertEmoji('🎉')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">🎉</button>
        <button onclick="insertEmoji('🙏')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">🙏</button>
        <button onclick="insertEmoji('😎')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">😎</button>
        <button onclick="insertEmoji('😢')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">😢</button>
        <button onclick="insertEmoji('🤔')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">🤔</button>
        <button onclick="insertEmoji('🚀')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">🚀</button>
        <button onclick="insertEmoji('✨')" class="hover:bg-gray-100 dark:hover:bg-gray-700 p-1 rounded">✨</button>
      </div>

      <!-- Fortschrittsbalken -->
      <div id="fileProgressContainer" class="hidden px-4 py-2 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <div class="flex justify-between text-xs mb-1 font-medium">
          <span id="fileProgressName">Datei wird gesendet...</span>
          <span id="fileProgressPercent">0%</span>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
          <div id="fileProgressBar" class="btn-primary h-full w-0 transition-all duration-150"></div>
        </div>
      </div>

      <!-- Chat Eingabeleiste -->
      <footer class="p-3 sm:p-4 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <form onsubmit="handleSendSubmit(event)" class="flex items-center space-x-2">

          <button type="button" onclick="toggleEmojiPicker()" class="p-3 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-gray-600 dark:text-gray-300 transition flex-shrink-0" title="Emoji einfügen">
            <i class="fa-regular fa-face-smile text-lg"></i>
          </button>

          <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
          <button type="button" onclick="document.getElementById('fileInput').click()" class="p-3 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-gray-600 dark:text-gray-300 transition flex-shrink-0" title="Datei anhängen">
            <i class="fa-solid fa-paperclip text-lg"></i>
          </button>

          <input type="text" id="msgInput" placeholder="Nachricht schreiben (Markdown unterstützt)..." class="flex-1 p-3 bg-gray-100 dark:bg-gray-700 border-none rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm transition">

          <button type="submit" class="btn-primary p-3 px-5 rounded-xl font-medium shadow-md transition flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-paper-plane sm:mr-2"></i>
            <span class="hidden sm:inline">Senden</span>
          </button>
        </form>
      </footer>

    </div>
  </div>

  <!-- JavaScript Logik -->
  <script>
    let pc;
    let dataChannel;
    let localStream;

    const config = {
      iceServers: [{
          urls: 'stun:stun.l.google.com:19302'
        },
        {
          urls: 'stun:stun1.l.google.com:19302'
        },
        {
          urls: 'stun:stun.services.mozilla.com'
        }
      ]
    };

    const CHUNK_SIZE = 16384;

    let incomingFileInfo = null;
    let incomingFileData = [];
    let incomingBytesReceived = 0;

    // UI-Elemente
    const statusBadge = document.getElementById('statusBadge');
    const settingsPanel = document.getElementById('settingsPanel');
    const chatlog = document.getElementById('chatlog');
    const dropOverlay = document.getElementById('dropOverlay');
    const diagStatusText = document.getElementById('diagStatusText');
    const diagSpinner = document.getElementById('diagSpinner');
    const iceStateBadge = document.getElementById('iceStateBadge');
    const errorAlert = document.getElementById('errorAlert');

    // Theme Wechsler
    function changeTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('webrtc_theme', theme);
    }
    const savedTheme = localStorage.getItem('webrtc_theme') || 'light';
    document.getElementById('themeSelect').value = savedTheme;
    changeTheme(savedTheme);

    function toggleSettings() {
      settingsPanel.classList.toggle('hidden');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fullscreenIcon').className = "fa-solid fa-compress";
      } else {
        document.exitFullscreen().catch(() => {});
        document.getElementById('fullscreenIcon').className = "fa-solid fa-expand";
      }
    }

    function copyToClipboard(elementId, btn) {
      const textarea = document.getElementById(elementId);
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      const originalIcon = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check text-green-500"></i>';
      setTimeout(() => {
        btn.innerHTML = originalIcon;
      }, 2000);
    }

    // NEU: Link Kopieren für Messenger
    function copyShareLink(btn) {
      const offerVal = document.getElementById('localOffer').value.trim();
      if (!offerVal) return;
      
      try {
        const encoded = encodeURIComponent(offerVal);
        const baseUrl = window.location.href.split('#')[0];
        const shareUrl = `${baseUrl}#offer=${encoded}`;

        navigator.clipboard.writeText(shareUrl).then(() => {
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-check text-white mr-1.5"></i> Link kopiert!';
          btn.classList.add('bg-green-600');
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('bg-green-600');
          }, 2500);
        });
      } catch (e) {
        showError("Fehler beim Generieren des Links.");
      }
    }

    function showError(msg) {
      if (msg) {
        errorAlert.classList.remove('hidden');
        document.getElementById('errorMessage').innerText = msg;
      } else {
        errorAlert.classList.add('hidden');
      }
    }

    function updateStatus(state, diagText = '') {
      if (state === 'connected') {
        statusBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900/50 dark:text-green-300";
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-green-500"></span> Verbunden';
        diagStatusText.innerText = diagText || "P2P-Verbindung hergestellt!";
        diagSpinner.classList.add('hidden');
        showError(null);
        if (window.innerWidth < 768) settingsPanel.classList.add('hidden');
      } else if (state === 'connecting') {
        statusBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-300";
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-yellow-500 animate-pulse"></span> Verbinde...';
        diagStatusText.innerText = diagText || "Prüfe Netzwerkpfade (ICE)...";
        diagSpinner.classList.remove('hidden');
      } else if (state === 'failed') {
        statusBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300";
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-red-500"></span> Fehlgeschlagen';
        diagStatusText.innerText = diagText || "Verbindung fehlgeschlagen (NAT/Firewall Blockade)";
        diagSpinner.classList.add('hidden');
      } else {
        statusBadge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300";
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-red-500"></span> Getrennt';
        diagStatusText.innerText = diagText || "Getrennt (Bereit)";
        diagSpinner.classList.add('hidden');
      }
    }

    // --- WebRTC PeerConnection Setup ---

    function initPeerConnection() {
      if (pc) pc.close();
      pc = new RTCPeerConnection(config);

      pc.oniceconnectionstatechange = () => {
        iceStateBadge.innerText = `ICE: ${pc.iceConnectionState}`;
        if (pc.iceConnectionState === 'checking') {
          updateStatus('connecting', 'Netzwerkpfade werden ausgehandelt...');
        } else if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          updateStatus('connected', 'Direkte P2P-Verbindung aktiv!');
        } else if (pc.iceConnectionState === 'failed') {
          updateStatus('failed', 'Verbindung fehlgeschlagen. Prüfe den STUN-Server oder versuche es im selben WLAN.');
          showError("STUN/NAT-Fehler: Keine direkte Verbindung zwischen den Geräten möglich.");
        } else if (pc.iceConnectionState === 'disconnected') {
          updateStatus('disconnected', 'Verbindung unterbrochen.');
        }
      };

      pc.ontrack = (event) => {
        const remoteVideo = document.getElementById('remoteVideo');
        remoteVideo.srcObject = event.streams[0];
        document.getElementById('videoContainer').classList.remove('hidden');
      };

      return pc;
    }

    async function startCall() {
      showError(null);
      initPeerConnection();
      dataChannel = pc.createDataChannel("chat");
      setupDataChannel();

      pc.onicecandidate = (e) => {
        if (e.candidate === null) {
          document.getElementById('localOffer').value = JSON.stringify(pc.localDescription);
          document.getElementById('btnShareLink').removeAttribute('disabled');
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      updateStatus('connecting', 'Angebot erstellt. Warte auf Antwort von Peer B...');
    }

    async function acceptCall() {
      showError(null);
      const offerStr = document.getElementById('remoteOffer').value.trim();
      if (!offerStr) return showError("Bitte füge zuerst das Angebot von Peer A in Feld 2 ein!");

      try {
        const offer = JSON.parse(offerStr);
        initPeerConnection();

        pc.ondatachannel = (e) => {
          dataChannel = e.channel;
          setupDataChannel();
        };

        await pc.setRemoteDescription(offer);

        pc.onicecandidate = (e) => {
          if (e.candidate === null) {
            document.getElementById('localAnswer').value = JSON.stringify(pc.localDescription);
          }
        };

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        updateStatus('connecting', 'Antwort erstellt. Sende diese zurück an Peer A.');
      } catch (err) {
        showError("Ungültiger Code in Feld 2! Der JSON-Text wurde nicht vollständig kopiert.");
      }
    }

    async function confirmAnswer() {
      showError(null);
      const answerStr = document.getElementById('remoteAnswer').value.trim();
      if (!answerStr) return showError("Bitte füge zuerst die Antwort von Peer B in Feld 3 ein!");

      try {
        const answer = JSON.parse(answerStr);
        updateStatus('connecting', 'Verbindungsaufbau wird gestartet...');
        await pc.setRemoteDescription(answer);
      } catch (err) {
        showError("Ungültiger Code in Feld 3! Der JSON-Text wurde nicht vollständig kopiert.");
        updateStatus('failed', 'Signalisierungs-Fehler.');
      }
    }

    function setupDataChannel() {
      dataChannel.binaryType = 'arraybuffer';

      dataChannel.onopen = () => {
        updateStatus('connected');
        appendSystemMessage("Verbindung erfolgreich aufgebaut!");
      };

      dataChannel.onclose = () => {
        updateStatus('disconnected');
        appendSystemMessage("Verbindung getrennt.");
      };

      dataChannel.onmessage = (e) => {
        if (typeof e.data === 'string') {
          const data = JSON.parse(e.data);

          if (data.type === 'text') {
            appendMessage(data.content, 'recv', data.id);
            dataChannel.send(JSON.stringify({
              type: 'read-ack',
              id: data.id
            }));
          } else if (data.type === 'read-ack') {
            markAsRead(data.id);
          } else if (data.type === 'file-start') {
            incomingFileInfo = data;
            incomingFileData = [];
            incomingBytesReceived = 0;
            showProgress(true, `Empfange: ${data.name}`, 0);
          } else if (data.type === 'wb-draw') {
            drawRemoteWhiteboard(data);
          } else if (data.type === 'wb-clear') {
            clearWhiteboard(false);
          }
        } else {
          incomingFileData.push(e.data);
          incomingBytesReceived += e.data.byteLength;
          const percent = Math.round((incomingBytesReceived / incomingFileInfo.size) * 100);
          showProgress(true, `Empfange: ${incomingFileInfo.name}`, percent);

          if (incomingBytesReceived >= incomingFileInfo.size) {
            showProgress(false);
            const blob = new Blob(incomingFileData, {
              type: incomingFileInfo.fileType
            });
            appendFileMessage(blob, incomingFileInfo.name, incomingFileInfo.fileType, 'recv');
            incomingFileInfo = null;
            incomingFileData = [];
          }
        }
      };
    }

    // --- Video / Screen Sharing ---

    async function toggleScreenShare() {
      if (!pc || (pc.connectionState !== 'connected' && pc.iceConnectionState !== 'connected')) {
        alert("Bitte stelle zuerst eine P2P-Verbindung her!");
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('videoContainer').classList.remove('hidden');

        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
      } catch (err) {
        console.error("Fehler beim Bildschirm teilen:", err);
      }
    }

    function closeScreenShare() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('videoContainer').classList.add('hidden');
    }

    // --- Emojis & Markdown ---

    function toggleEmojiPicker() {
      document.getElementById('emojiPicker').classList.toggle('hidden');
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('msgInput');
      input.value += emoji;
      document.getElementById('emojiPicker').classList.add('hidden');
      input.focus();
    }

    // --- Chat Logik & Lesebestätigungen ---

    function handleSendSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();

      if (!msg) return;
      if (!dataChannel || dataChannel.readyState !== 'open') {
        alert("Es besteht noch keine aktive Verbindung!");
        return;
      }

      const msgId = 'msg-' + Date.now();
      dataChannel.send(JSON.stringify({
        type: 'text',
        content: msg,
        id: msgId
      }));
      appendMessage(msg, 'sent', msgId);
      input.value = '';
    }

    function appendMessage(text, type, msgId) {
      const isSent = type === 'sent';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isSent ? 'items-end' : 'items-start'}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl ${isSent ? 'msg-sent rounded-br-none shadow-md' : 'msg-recv rounded-bl-none shadow-sm'}`;

      const cleanHtml = DOMPurify.sanitize(marked.parse(text));
      msgDiv.innerHTML = `<div class="markdown-body">${cleanHtml}</div>`;

      const metaDiv = document.createElement('div');
      metaDiv.className = "text-[10px] opacity-70 mt-1 flex items-center justify-end space-x-1";

      metaDiv.innerHTML = `<span>${getTimeString()}</span>`;
      if (isSent) {
        metaDiv.innerHTML += `<i id="ack-${msgId}" class="fa-solid fa-check text-gray-300 ml-1"></i>`;
      }

      msgDiv.appendChild(metaDiv);
      wrapper.appendChild(msgDiv);
      chatlog.appendChild(wrapper);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    function markAsRead(msgId) {
      const ackIcon = document.getElementById(`ack-${msgId}`);
      if (ackIcon) {
        ackIcon.className = "fa-solid fa-check-double text-blue-300 ml-1";
      }
    }

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = "text-center my-2 text-xs text-gray-500 dark:text-gray-400 font-medium italic";
      div.innerText = text;
      chatlog.appendChild(div);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    // --- Datei-Übertragung ---

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) sendFile(file);
    }

    async function sendFile(file) {
      if (!dataChannel || dataChannel.readyState !== 'open') {
        alert("Es besteht noch keine aktive Verbindung!");
        return;
      }

      dataChannel.send(JSON.stringify({
        type: 'file-start',
        name: file.name,
        size: file.size,
        fileType: file.type
      }));

      showProgress(true, `Sende: ${file.name}`, 0);

      const buffer = await file.arrayBuffer();
      let offset = 0;

      while (offset < buffer.byteLength) {
        const chunk = buffer.slice(offset, offset + CHUNK_SIZE);
        dataChannel.send(chunk);
        offset += chunk.byteLength;

        const percent = Math.round((offset / buffer.byteLength) * 100);
        showProgress(true, `Sende: ${file.name}`, percent);

        if (dataChannel.bufferedAmount > CHUNK_SIZE * 8) {
          await new Promise(resolve => setTimeout(resolve, 50));
        }
      }

      showProgress(false);
      appendFileMessage(file, file.name, file.type, 'sent');
      document.getElementById('fileInput').value = '';
    }

    function appendFileMessage(fileOrBlob, filename, fileType, type) {
      const isSent = type === 'sent';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isSent ? 'items-end' : 'items-start'}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl ${isSent ? 'msg-sent rounded-br-none shadow-md' : 'msg-recv rounded-bl-none shadow-sm'}`;

      const url = URL.createObjectURL(fileOrBlob);

      if (fileType.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = url;
        img.className = "max-w-full max-h-60 rounded-lg cursor-pointer object-cover mb-1";
        img.onclick = () => openLightbox(url);
        msgDiv.appendChild(img);
      } else {
        const fileBox = document.createElement('div');
        fileBox.className = "flex items-center space-x-3 p-2 bg-black/10 dark:bg-white/10 rounded-xl mb-1";
        fileBox.innerHTML = `
            <i class="fa-solid fa-file text-2xl"></i>
            <div class="overflow-hidden text-ellipsis">
                <div class="font-bold text-xs truncate">${filename}</div>
                <div class="text-[10px] opacity-75">${formatBytes(fileOrBlob.size)}</div>
            </div>
            <a href="${url}" download="${filename}" class="p-2 bg-white/20 hover:bg-white/30 rounded-lg text-xs font-bold transition flex items-center justify-center">
                <i class="fa-solid fa-download"></i>
            </a>
        `;
        msgDiv.appendChild(fileBox);
      }

      const timeDiv = document.createElement('span');
      timeDiv.className = "text-[10px] opacity-70 block text-right";
      timeDiv.innerText = getTimeString();
      msgDiv.appendChild(timeDiv);

      wrapper.appendChild(msgDiv);
      chatlog.appendChild(wrapper);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    function showProgress(show, name = '', percent = 0) {
      const container = document.getElementById('fileProgressContainer');
      if (show) {
        container.classList.remove('hidden');
        document.getElementById('fileProgressName').innerText = name;
        document.getElementById('fileProgressPercent').innerText = `${percent}%`;
        document.getElementById('fileProgressBar').style.width = `${percent}%`;
      } else {
        container.classList.add('hidden');
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getTimeString() {
      return new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightboxModal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
    }

    // --- Gemeinsames Whiteboard Logik ---

    const canvas = document.getElementById('wbCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let isEraser = false;
    let lastX = 0;
    let lastY = 0;

    function toggleWhiteboard() {
      const modal = document.getElementById('whiteboardModal');
      modal.classList.toggle('active');
      if (modal.classList.contains('active')) {
        resizeCanvas();
      }
    }

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    function setEraser() {
      isEraser = !isEraser;
      const btn = document.getElementById('wbEraserBtn');
      btn.classList.toggle('bg-blue-500', isEraser);
      btn.classList.toggle('text-white', isEraser);
    }

    function startDrawing(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      lastX = (clientX - rect.left) / canvas.width;
      lastY = (clientY - rect.top) / canvas.height;
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const currentX = (clientX - rect.left) / canvas.width;
      const currentY = (clientY - rect.top) / canvas.height;

      const color = isEraser ? '#ffffff' : document.getElementById('wbColor').value;
      const size = document.getElementById('wbBrushSize').value;

      drawSegment(lastX, lastY, currentX, currentY, color, size);

      if (dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify({
          type: 'wb-draw',
          x0: lastX,
          y0: lastY,
          x1: currentX,
          y1: currentY,
          color: color,
          size: size
        }));
      }

      lastX = currentX;
      lastY = currentY;
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function drawSegment(x0, y0, x1, y1, color, size) {
      ctx.beginPath();
      ctx.moveTo(x0 * canvas.width, y0 * canvas.height);
      ctx.lineTo(x1 * canvas.width, y1 * canvas.height);
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.closePath();
    }

    function drawRemoteWhiteboard(data) {
      drawSegment(data.x0, data.y0, data.x1, data.y1, data.color, data.size);
    }

    function clearWhiteboard(broadcast = true) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (broadcast && dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify({
          type: 'wb-clear'
        }));
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    // Drag & Drop
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });
    dropOverlay.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
    });
    dropOverlay.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      if (e.dataTransfer.files.length > 0) sendFile(e.dataTransfer.files[0]);
    });

    // NEU: Beim Laden prüfen, ob ein Angebot im URL-Hash übergeben wurde
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.includes('offer=')) {
        try {
          const encodedOffer = hash.split('offer=')[1];
          const decodedOffer = decodeURIComponent(encodedOffer);
          document.getElementById('remoteOffer').value = decodedOffer;
          // Automatisches Öffnen der Einstellungs-Sektion, damit Peer B direkt Schritt 2 sieht
          settingsPanel.classList.remove('hidden');
          appendSystemMessage("Angebot aus Link geladen! Klicke auf 'Antwort generieren'.");
        } catch (e) {
          console.error("Fehler beim Auslesen des Angebots aus der URL:", e);
        }
      }
    });
  </script>
</body>
